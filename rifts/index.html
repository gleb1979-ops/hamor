const unlock=()=>{initAudio();if(AC&&AC.state==='suspended')AC.resume()};['touchend','click','keydown'].forEach(t=>addEventListener(t,unlock,{passive:true}));
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();if(!r.width||!r.height)return;const nw=Math.round(clamp(H*r.width/r.height,1280,1720));if(nw!==W){W=nw;cvs.width=W;light.width=W;makeVig()}}
resize();addEventListener('resize',resize);try{new ResizeObserver(resize).observe(document.getElementById('wrap'))}catch(e){}
// Hook for future online play: the host page feeds remote players' inputs and reads a compact state snapshot.
window.TriRazloma={maxPlayers:4,
 setInput(i,inp){REMOTE[i]=inp||null},
 join(i,hero){if(state==='select'&&slots[i]){slots[i].joined=true;if(hero!=null)slots[i].hero=hero%HEROES.length}},
 snapshot(){return{state,stageIdx,phase,waveNum,players:players.map(p=>({i:p.i,hero:p.hero,x:p.x,y:p.y,face:p.face,hp:p.hp,max:p.max,energy:p.energy,down:p.down,pw:p.pw,shield:p.shield})),enemies:enemies.map(e=>({type:e.type,x:e.x,y:e.y,hp:e.hp,max:e.max})),boss:boss?{x:boss.x,y:boss.y,hp:boss.hp,max:boss.max}:null,bullets:bullets.map(b=>({x:b.x,y:b.y,r:b.r})),pickups:pickups.map(k=>({kind:k.kind,x:k.x,y:k.y}))}}};
buildStage(0);
const HOME_URL=NET_OK?'../?lang=ru':'';
if(NET_OK){const rq=new URLSearchParams(location.search).get('room');if(rq&&/^[A-Za-z0-9]{4}$/.test(rq))guestJoin(rq.toUpperCase())}
let last=performance.now();
const bPEl=document.getElementById('bP');
function frame(now){const dt=Math.min(0.033,Math.max(0,(now-last)/1000));last=now;pollInput();update(dt);render();if(touch.on){const h=!(state==='play'||state==='gameover'||state==='victory')||pauseOpen;if(bPEl.hidden!==h)bPEl.hidden=h}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
try{cvs.focus({preventScroll:true})}catch(e){}
