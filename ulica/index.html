function limb(g,x1,y1,x2,y2,w,c){g.lineCap='round';g.strokeStyle='#0d0b10';g.lineWidth=w+5;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function rr(g,x,y,w,h,r,fill,lw){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h);g.fillStyle=fill;g.fill();if(lw!==0){g.strokeStyle='#0d0b10';g.lineWidth=lw||3.5;g.stroke()}}
function circ(g,x,y,r,fill,lw){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=fill;g.fill();if(lw){g.strokeStyle='#0d0b10';g.lineWidth=lw;g.stroke()}}

function mkNPC(i,k){const f=newFighter(i,0,true,1);const N=NPC[k];f.npc=k;f.hp=f.max=N.hp;f.name=N.name;f.weapon=N.weapon;f.onBoard=false;f.face=-1;if(k==='dog'){f.sleep=1;f.face=1}return f}
function castObj(F,r){const me=F[0],others=[0,1,2,3].filter(h=>h!==myHero);
 if(mode==='zavod'){me.x=95;me.y=528;me.face=1;
  const al=newFighter(1,others[0],true,0);al.ally=true;al.name='На шухере';al.x=72;al.y=640;al.face=1;al.shuher=1;F.push(al);
  const ZD=ZL[LOC],paths=ZD.paths,gn=['Сторож Петрович','Сторож Михалыч','Вохра','Сторож Палыч'];
  for(let i=0;i<Math.min(4,1+r);i++){const g=mkNPC(F.length,'guard');g.name=gn[i];g.path=paths[i];g.wi=1;g.x=paths[i][0][0];g.y=paths[i][0][1];g.face=paths[i][1][0]>=paths[i][0][0]?1:-1;F.push(g)}
  const d=mkNPC(F.length,'ded');d.x=ZD.ded[0];d.y=ZD.ded[1];d.face=1;F.push(d);
  for(const [x,y] of ZD.dogs){const dg=mkNPC(F.length,'dog');dg.x=x;dg.y=y;F.push(dg)}}
 else{me.x=120;me.y=520;me.face=1;
  const al=newFighter(1,others[0],true,0);al.ally=true;al.name='Свой';al.x=90;al.y=622;al.face=1;al.slot=-70;F.push(al);
  const own=newFighter(2,others[1],true,1);own.name='Видик';own.hp=own.max=Math.round(own.max*1.25);own.weapon='bat';own.dur=16;own.x=ZONE.x+10;own.y=ZONE.y-4;own.face=-1;own.slot=0;F.push(own);
  const nb=r>=3?3:2,nm=['Каратист','Бобина','Кассета'],wp=['nunchaku',null,'chain'];
  for(let i=0;i<nb;i++){const b=newFighter(F.length,others[1+(i+1)%2],true,1);b.name=nm[i];b.x=ZONE.x-100+i*190;b.y=ZONE.y-12+i*14;b.face=-1;b.slot=rnd(-150,150);b.weapon=wp[i];if(b.weapon)b.dur=WEAPONS[b.weapon].dur;F.push(b)}}}

/* ----- AI helpers ----- */
function goTo(f,x,y){const dx=x-f.x,dy=y-f.y,d=Math.hypot(dx,dy);if(d<12)return[0,0];if(Math.abs(dx)>6)f.face=dx>0?1:-1;return[dx/d,clamp(dy/d*1.6,-1,1)]}
function fightMove(f,tg,dt){const w=f.weapon?WEAPONS[f.weapon]:WEAPONS.fist,want=w.gun?380:w.range*.7,dx=tg.x-f.x,dy=tg.y-f.y;let mx=0,my=0;
 if(Math.abs(dx)>want+10)mx=Math.sign(dx);else if(Math.abs(dx)<want-30&&!w.gun)mx=-Math.sign(dx)*.4;if(Math.abs(dy)>12)my=Math.sign(dy);f.face=dx>=0?1:-1;
 if(Math.abs(dy)<26&&Math.abs(dx)<w.range+10&&Math.random()<dt*(f.team===1?1.5:2.6))attack(f);if(f.npc!=='dog'&&Math.abs(dy)<26&&Math.abs(dx)<70&&Math.random()<dt*.5)kick(f);return[mx,my]}
function wantItem(f){if(f.npc)return null;if(f.hp<f.max*.4){const k=G.P.filter(p=>p.k==='kefir').sort((a,b)=>dist(a,f)-dist(b,f))[0];if(k&&dist(k,f)<500)return k}
 if(!f.weapon&&!f.carry){const p=G.P.filter(p=>p.k!=='kefir').sort((a,b)=>dist(a,f)-dist(b,f))[0];if(p&&dist(p,f)<200)return p}return null}
function npcThink(f,dt){const en=alive().filter(b=>b.team===0&&!b.shuher).sort((a,b)=>dist(a,f)-dist(b,f)),C=G.crate,car=C.c&&C.c.team===0?C.c:null;
 if(f.npc==='ded'){if(!G.alarm||!en.length)return[0,0];const tg=en[0];f.face=tg.x>f.x?1:-1;if(Math.abs(tg.y-f.y)<55&&Math.abs(tg.x-f.x)<560&&f.cd<=0&&Math.random()<dt*3)attack(f);if(Math.abs(tg.x-f.x)<70&&Math.abs(tg.y-f.y)<28&&Math.random()<dt)kick(f);return[0,0]}
 if(f.npc==='dog'){if(f.sleep||!en.length)return[0,0];if(Math.random()<dt*.5)SFX.bark();return fightMove(f,car||en[0],dt)}
 if(!G.alarm){const P=f.path,wp=P[f.wi];if(f.wait>0){f.wait-=dt;if(f.wait<.7&&!f.turned){f.face*=-1;f.turned=1}return[0,0]}
  const dx=wp[0]-f.x,dy=wp[1]-f.y,d=Math.hypot(dx,dy);if(d<8){f.wi=(f.wi+1)%P.length;f.wait=1.7;f.turned=0;return[0,0]}if(Math.abs(dx)>4)f.face=dx>0?1:-1;return[dx/d*.45,dy/d*.45]}
 if(!en.length)return[0,0];return fightMove(f,car||en[0],dt)}
function allyZavod(f,dt){const me=G.F[0],C=G.crate;if(f.shuher){f.face=1;return[0,0]}
 if(f.carry)return goTo(f,EXIT.x,EXIT.y);
 const en=alive().filter(b=>b.team===1&&b.state!=='down'&&!b.sleep);const near=en.slice().sort((a,b)=>dist(a,f)-dist(b,f))[0];
 if(near&&dist(near,f)<200)return fightMove(f,near,dt);
 if(!C.c)return goTo(f,C.x,C.y);
 if(f===me)return goTo(f,EXIT.x,EXIT.y);
 const thr=en.slice().sort((a,b)=>dist(a,me)-dist(b,me))[0];if(thr&&dist(thr,me)<320)return fightMove(f,thr,dt);

function inZone(b,k){return((b.x-ZONE.x)/(ZONE.rx*k))**2+((b.y-ZONE.y)/(ZONE.ry*k))**2<1}
function salonThink(f,dt){const en=alive().filter(b=>sideOf(b)!==sideOf(f)&&b.state!=='down');
 const it=wantItem(f);if(it)return goTo(f,it.x,it.y);
 const byMe=(a,b)=>dist(a,f)-dist(b,f),near=en.slice().sort(byMe)[0],inZ=en.filter(b=>inZone(b,f.team===1?1.7:1.3)).sort(byMe)[0];
 const tg=inZ||(near&&dist(near,f)<(f.team===1?260:200)?near:null);
 if(tg)return fightMove(f,tg,dt);

/* ----- objective updates ----- */
function coneOf(f){return{x:f.x+f.face*18,y:f.y-2,a:(f.face>0?0:Math.PI)+Math.sin(G.t*1.2+f.idx*1.7)*.3,h:.42,R:300}}
function seesIt(c,e){const dx=e.x-c.x,dy=(e.y-c.y)/.55,d=Math.hypot(dx,dy);if(d<55)return true;if(d>c.R)return false;let df=Math.atan2(dy,dx)-c.a;df=Math.atan2(Math.sin(df),Math.cos(df));if(Math.abs(df)>c.h)return false;
 for(let k=1;k<10;k++){const px=c.x+(e.x-c.x)*k/10,py=c.y+(e.y-c.y)*k/10;for(const o of OBST)if(px>o.x-4&&px<o.x+o.w+4&&py>o.y-36&&py<o.y+o.h+4)return false}return true}
function raiseAlarm(){if(mode!=='zavod'||G.alarm||G.over)return;G.alarm=1;G.sus=1;SFX.bell();G.msg='ТРЕВОГА!';G.sub='Хватай ящик и беги к дыре в заборе!';G.msgT=2;
 for(const f of G.F){if(f.npc==='dog'&&f.sleep){f.sleep=0;f.face=-1}if(f.shuher)f.shuher=0}SFX.bark()}
function dropCrate(f,thr){const C=G.crate;if(!C||C.c!==f)return;C.c=null;f.carry=0;C.x=clamp(f.x+f.face*(thr?50:10),70,W-60);C.y=clamp(f.y+(thr?0:6),FLOOR0+60,FLOOR1-10);C.cd=thr?.7:.4;SFX.heavy()}

function zavodUpdate(dt){const C=G.crate;G.tl-=dt;if(G.tl<=0){G.obj=-1;return}
 G.sl=ZL[LOC].sl(G.t);
 const tg=G.F.filter(f=>f.team===0&&f.state!=='ko'&&!f.shuher);let see=0;
 for(const g of G.F){g.sees=0;if(g.npc!=='guard'||g.state==='ko'||g.state==='down'||G.alarm)continue;const c=coneOf(g);for(const e of tg)if(seesIt(c,e)){g.sees=1;see=Math.max(see,1.6)}}
 for(const e of tg)if(((e.x-G.sl.x)/95)**2+((e.y-G.sl.y)/42)**2<1)see=Math.max(see,2.6);
 for(const d of G.F){if(d.npc!=='dog')continue;if(d.flee){d.x+=380*dt;continue}if(d.sleep&&d.state!=='ko'){const nr=tg.some(e=>dist(e,d)<130);d.wk=nr?(d.wk||0)+dt:Math.max(0,(d.wk||0)-dt);if(d.wk>1.1){G.FX.push({x:d.x,y:d.y-90,t:0,life:.8,txt:'ГАВ!',c:'#ffd23f'});raiseAlarm()}}}

 else{G.sirT-=dt;if(G.sirT<=0){SFX.siren();G.sirT=1.4}}

const UPS={hp:{name:'Здоровье',desc:'+8%'},pow:{name:'Удар',desc:'+6%'},spd:{name:'Скорость',desc:'+4%'}},UPMAX=5;
const PROG=(()=>{const p=LS.get('prog',null);if(p&&p.h&&p.h.length>=4){while(p.h.length<HEROES.length)p.h.push({xp:0,lv:1,pts:0,up:{hp:0,pow:0,spd:0}});return p}return{h:HEROES.map(()=>({xp:0,lv:1,pts:0,up:{hp:0,pow:0,spd:0}}))}})();
const RANKS=['Новичок','Свой','Боец','Уличный','Авторитет','Легенда'];
function rankOf(lv){return RANKS[Math.min(5,(lv-1)>>1)]}
function xpNeed(lv){return 80+lv*60}
function saveProg(){LS.set('prog',PROG)}
function applyProg(f){const P=PROG.h[f.hero];f.mPow=1+P.up.pow*.06;f.mSpd=1+P.up.spd*.04;f.hp=f.max=Math.round(HEROES[f.hero].hp*(1+P.up.hp*.08))+(P.lv-1)*2}

 if(up){MLV+=up;if(G&&G.F){const me=G.F[0];G.FX.push({x:me.x,y:me.y-215,t:0,life:1.8,txt:'НОВЫЙ УРОВЕНЬ!',c:'#7cf07c',big:1});SFX.bell()}}}
function progHTML(){const P=PROG.h[myHero],k=Math.min(100,P.xp/xpNeed(P.lv)*100);
 return `<div class="pbox"><b>${HEROES[myHero].name} · уровень ${P.lv} · ${rankOf(P.lv)}</b><div class="xpb"><i style="width:${k}%"></i></div><small>опыт ${P.xp}/${xpNeed(P.lv)} · очки прокачки: <b style="color:var(--gold)">${P.pts}</b></small>
 <div class="row">${Object.entries(UPS).map(([u,d])=>`<button class="up" data-u="${u}" ${P.pts>0&&P.up[u]<UPMAX?'':'disabled'}>${d.name} ${P.up[u]}/${UPMAX} <small>${d.desc}</small> ＋</button>`).join('')}</div>
 <small style="opacity:.7">Опыт: нокаут +25, победа в раунде +40 (задание +60), победа в матче +100</small></div>`}
