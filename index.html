/* Layout: one column storefront — wordmark hero, promise chips, two game cards, three steps, share band. */
:root{--bg:#170f1c;--panel:#241830;--panel2:#2e2040;--fg:#fff6ec;--muted:#c2b2c9;--mustard:#ffc531;--ketchup:#e8412c;--grass:#4caf50;--line:#3f2d4c;
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 45% at 50% 0%,#3a2552 0%,transparent 70%),radial-gradient(40% 30% at 90% 60%,#3a1f2a 0%,transparent 70%)}
.wrap{max-width:960px;margin:0 auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 40px;display:grid;gap:44px}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mini{font-weight:900;letter-spacing:.06em;font-size:15px}.mini b{color:var(--mustard)}
.brandmark{display:flex;align-items:center;gap:10px;text-decoration:none}.brandmark img{width:42px;height:42px;border-radius:11px;filter:drop-shadow(0 3px 0 #0006)}
.langs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}.langs button{font:inherit;font-size:13px;font-weight:900;background:none;border:0;color:var(--muted);border-radius:999px;padding:6px 11px;cursor:pointer}.langs button.on{background:var(--mustard);color:#2b1b30}
.heroicon{width:clamp(96px,22vw,140px);height:auto;filter:drop-shadow(0 8px 0 #0007);animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.heroicon{animation:none}}
.lang{font:inherit;font-size:14px;font-weight:700;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.hero{text-align:center;display:grid;justify-items:center;gap:14px;padding-top:10px}
.word{font-weight:900;line-height:.86;margin:0;letter-spacing:-.01em;direction:ltr}
.word .a{display:block;font-size:clamp(64px,19vw,150px);color:var(--mustard);text-shadow:0 7px 0 var(--ketchup)}
.word .b{display:block;font-size:clamp(50px,15vw,124px);color:#fff;text-shadow:0 6px 0 #2b1b30}
.pill{direction:ltr;display:inline-block;background:var(--ketchup);color:#fff;font-weight:900;letter-spacing:.08em;border-radius:999px;padding:9px 22px;font-size:clamp(15px,4vw,20px);box-shadow:0 5px 0 #9c2213;transform:rotate(-2deg)}
.slogan{font-size:clamp(18px,4.6vw,24px);font-weight:700;margin:6px 0 0;text-wrap:balance}
.slogan span{color:var(--mustard)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--fg)}
h2{font-size:clamp(24px,6vw,34px);font-weight:900;margin:0 0 14px;text-wrap:balance}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:26px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--mustard)}
.card>a{display:block}.card img{width:100%;max-width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover;display:block}
.cb{padding:16px 18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.cb h3{margin:0;font-size:26px;font-weight:900;color:var(--mustard)}
.cb p{margin:0;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

.locs{display:flex;gap:6px;flex-wrap:wrap}.locs span{font-size:13px;background:#ffc53122;color:var(--mustard);border-radius:8px;padding:3px 9px;font-weight:700}

.play:active{transform:translateY(3px);box-shadow:0 3px 0 #9c2213}
.play:focus-visible,.lang:focus-visible,.share:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:grid;gap:4px;counter-increment:s}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--mustard);color:#2b1b30;font-weight:900;display:grid;place-items:center;margin-bottom:4px}
.steps b{font-size:18px}.steps span{color:var(--muted);font-size:15px}
.band{background:linear-gradient(135deg,#2e2040,#3a1f2a);border:2px solid var(--line);border-radius:26px;padding:24px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.band p{margin:0;color:var(--muted);max-width:44ch}
.instTop{font:inherit;cursor:pointer;border:0;background:#ffc531;color:#2b1b30;font-weight:900;font-size:13px;border-radius:999px;padding:7px 12px;white-space:nowrap;box-shadow:0 3px 0 #b8860b;animation:blink 1.4s ease-in-out infinite}@keyframes blink{0%,100%{transform:scale(1);box-shadow:0 3px 0 #b8860b,0 0 0 0 #ffc53199}50%{transform:scale(1.07);box-shadow:0 3px 0 #b8860b,0 0 0 9px #ffc53100}}@media (prefers-reduced-motion:reduce){.instTop{animation:none}}
.sheet{position:fixed;inset:0;background:#000a;z-index:99;display:grid;place-items:end center;padding:16px}.sheetc{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:10px;justify-items:center;text-align:center;width:min(100%,420px)}.sheetc img{border-radius:16px}.sheetc b{font-size:20px}.sheetc p{margin:0}
@media (max-width:420px){.top .mini{display:none}}
#inst{display:none}.inst{font:inherit;cursor:pointer;border:0;text-decoration:none;display:inline-block;background:#ffc531;color:#2b1b30;font-weight:900;border-radius:999px;padding:13px 24px;font-size:17px;box-shadow:0 6px 0 #b8860b}.inst:disabled{opacity:.7}.insthint{margin:0;font-size:14px;opacity:.85;max-width:34ch;text-align:center}
.shsite{background:none;border:0;color:#fff9;font:inherit;font-weight:700;font-size:15px;text-decoration:underline;cursor:pointer;margin:-8px 0 16px;box-shadow:none}
.shtop{margin:4px 0 18px;border:0;font-size:18px;cursor:pointer;font-family:inherit}
.share{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#25d366;color:#0b2a17;font-weight:900;border-radius:999px;padding:13px 22px;box-shadow:0 6px 0 #128c4a}
.link{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--mustard);user-select:all;direction:ltr}
footer{text-align:center;color:var(--muted);font-size:13px;display:grid;gap:4px}
footer b{color:var(--fg);direction:ltr;display:inline-block}
@media (prefers-reduced-motion:reduce){.card,.card:hover{transition:none;transform:none}}
.nightb{display:flex;gap:14px;align-items:center;margin:18px auto 6px;max-width:960px;padding:12px;border-radius:20px;text-decoration:none;color:#f4f2ff;background:linear-gradient(120deg,#0b0a24,#2a1050 60%,#07071a);box-shadow:0 0 0 2px #22e3ff55,0 0 28px #ff3d8b44}
.nightb img{width:42%;max-width:340px;height:auto;aspect-ratio:1200/630;object-fit:cover;border-radius:14px;display:block;flex:0 0 auto}.nightb span{display:flex;flex-direction:column;gap:6px}.nightb b{font-size:clamp(18px,3.4vw,26px);color:#b6ff3b}.nightb small{font-size:14px;line-height:1.4;color:#c9c6ef}.nightb i{font-style:normal;font-weight:800;align-self:flex-start;background:linear-gradient(90deg,#22e3ff,#ff3d8b);color:#07071a;padding:8px 14px;border-radius:12px}
@media(max-width:560px){.nightb{flex-direction:column;align-items:stretch}.nightb img{width:100%;max-width:none}}
</style>

  race:{t:'Ночные гонки',d:'Ночные гонки по городу или по горной лесной дороге. Машина едет сама: рули, включай нитро и выталкивай соперников с дороги. В лесу съехал — упал! Гоняй каждый за себя или командой против ботов.',tags:['👥 1–4 игрока + боты', '⏱ ~60 сек', '🏎️ Гоняй и толкай']},
  box:{t:'Сумасшедший бокс',d:'Все против всех на ринге. Бей, уворачивайся и бей по яйцам, пока судья отвернулся. Заметит 2 раза — дисквалификация!',tags:['👥 1–4 игрока + боты','⏱ бой 45 сек','🥊 Драка']},

  bandT:'Поделись с друзьями',bandP:'Одна ссылка на все игры. Работает на любом телефоне, планшете и компьютере.',share:'Отправить в WhatsApp',
  shareText:'🎮 Tagshim — короткие игры с друзьями прямо в телефоне. Без скачивания! ',made:'Сделано в Tagshim'},
 he:{priv:'מדיניות פרטיות',shareAll:'לשתף את האתר',invite:'להזמין חברים לשחק',inviteMsg:c=>`בואו לשחק איתי ב-Tagshim! 🎮 חדר ${c} — לחצו על הקישור ונשחק ביחד: `,inst:'📲 להתקין את האפליקציה',instS:'להתקין',iosChrome:'ב-Chrome: כפתור שיתוף ⬆️ בשורת הכתובת ← «הוספה למסך הבית»',close:'הבנתי',instHint:'נפתח במסך מלא, בלי השורות של הדפדפן',openChrome:'📲 לפתוח ב-Chrome כדי להתקין',ios:'באייפון: שיתוף ⬆️ ← «הוספה למסך הבית»',andr:'לחצו ⋮ למעלה ← «הוספה למסך הבית» או «התקנת אפליקציה»',slogan:'שחקו <span>איפה שבא לכם</span>. שחקו <span>עם חברים</span>. שחקו <span>מהר</span>.',

  train:{t:'שודדי הרכבת',d:'שוד מצויר במערב הפרוע! תופסים שקי זהב מהרכבת, סוחבים לסוס ובורחים מהנהגים. משחקים כחבורה נגד הנהגים, או כל אחד לעצמו — חוטפים שקים זה מזה!',tags:['👥 ⁦1–4⁩ שחקנים + בוטים','⏱ 60 שניות או סיבובים','🚂 שודדים רכבת']},
  pirate:{t:'אוצר הפיראטים',d:'חופרים אוצר על סימני ה־X וסוחבים תיבות לסירה, בזמן ששלדים פיראטים רודפים אחריכם. צוות אחד נגד השלדים או כל פיראט לעצמו. שני איים: חוף ומקדש בג׳ונגל.',tags:['👥 \u20661–4\u2069 שחקנים + בוטים', '🗺 2 איים', '🏴\u200d☠️ חופרים ובורחים']},
  dino:{t:'לילה במוזיאון',d:'בלילה הדינוזאורים במוזיאון מתעוררים! אוספים מאובנים בחושך עם פנס, משחררים חברים קפואים ומסנוורים דינוזאורים בפלאש. או מצב הדבקה: כל מי שנתפס הופך לדינוזאור. שתי מפות: מוזיאון חשוך וג׳ונגל דינוזאורים.',tags:['👥 \u20661–4\u2069 שחקנים + בוטים', '🗺 2 מפות', '🦖 מתחבאים בחושך']},
  balloon:{t:'קרב בלונים',d:'לכל אחד 3 בלונים: מפוצצים לאחרים ושומרים על שלכם! תופסים בלונים מעופפים כדי לקבל אותם בחזרה. או משחקים ביחד נגד קיפודים דוקרניים שמפוצצים הכל. שתי מפות: יריד וגגות.',tags:['👥 \u20661–4\u2069 שחקנים + בוטים', '🗺 2 מפות', '🎈 מפוצצים ושומרים']},
  ghost:{t:'טירת הרוחות',d:'טירה חשוכה שבה הרוחות שקופות עד שהן מתקרבות. אוספים נרות עם פנס ומגרשים רוחות בהבזק. או שאחד מכם משחק רוח ומפחיד את האחרים! שתי מפות: האולם הגדול והמרתף.',tags:['👥 \u20661–4\u2069 שחקנים + בוטים', '🗺 2 מפות', '👻 מפחיד ומצחיק']},
  pizza:{t:'פיצה בטירוף',d:'פיצריה מטורפת: תופסים עגבניות, גבינה, פטריות ופלפלים מהארגזים ומכינים פיצה לפי המתכון. חוטפים תוספות זה מזה, או מבשלים ביחד ומגרשים עכברושים שגונבים מהשולחן.',tags:['👥 \u20661–4\u2069 שחקנים + בוטים', '⏱ 50–60 שניות', '🍕 מבשלים וחוטפים']},
  sniper:{t:'צלף לילה',d:'לילה חשוך לגמרי בעיר או ביער. מזיזים את כוונת הצלף בחושך ומוצאים את האחרים ראשונים! כל ירייה מסגירה אותך, ורימון הבזק מאיר מחבוא לרגע. משחקים כל אחד לעצמו או ביחד נגד בוטים.',tags:['👥 \u20661–4\u2069 שחקנים + בוטים', '⏱ 75–90 שניות', '🎯 מוצאים ויורים']},
  race:{t:'מרוץ לילה',d:'מרוץ לילה בעיר או בדרך הררית ביער. המכונית נוסעת לבד: מכוונים, מפעילים ניטרו ודוחפים יריבים מהכביש. ביער — יורדים מהכביש ונופלים! כל אחד לעצמו או קבוצה נגד בוטים.',tags:['👥 \u20661–4\u2069 שחקנים + בוטים', '⏱ ~60 שניות', '🏎️ נוסעים ודוחפים']},
  box:{t:'אגרוף משוגע',d:'כולם נגד כולם בזירה. תכו, תתחמקו ותנו מכה נמוכה כשהשופט לא מסתכל. נתפסתם פעמיים — פסילה!',tags:['👥 ⁦1–4⁩ שחקנים + בוטים','⏱ קרב של 45 שניות','🥊 קרב']},
  snow:{t:'קרב כדורי שלג',d:'זורקים כדורי שלג, מתחבאים מאחורי אנשי שלג ותופסים את כדור הזהב לנקודה כפולה.',tags:['👥 ⁦1–4⁩ שחקנים + בוטים','⏱ סיבוב 40 שנ׳','❄️ מכוונים']},
  how:'איך מתחילים',steps:[['בוחרים משחק','לוחצים «לשחק» על כל כרטיס.'],['יוצרים חדר','כותבים שם ולוחצים «יצירת משחק».'],['מזמינים חברים','כפתור הוואטסאפ שולח קישור לקבוצה. זהו!']],
  bandT:'שתפו עם חברים',bandP:'קישור אחד לכל המשחקים. עובד בכל טלפון, טאבלט ומחשב.',share:'לשלוח בוואטסאפ',
  shareText:'🎮 Tagshim — משחקים קצרים עם חברים ישר בטלפון. בלי להוריד! ',made:'נוצר על ידי Tagshim'}};
const params=new URLSearchParams(location.search);
const LANGS=[['en','EN'],['ru','RU'],['he','עב']];
let lang=LANGS.some(l=>l[0]===params.get('lang'))?params.get('lang'):null;
if(!lang){try{lang=localStorage.getItem('byd-lang3')}catch(e){}}
if(!LANGS.some(l=>l[0]===lang))lang='en';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(k,img,href){const g=L[lang][k];return `<article class="card"><a href="${href}" aria-label="${esc(g.t)}"><img src="${img}" alt="" loading="lazy" width="1200" height="630"></a>
  <div class="cb"><h3>${esc(g.t)}</h3><p>${esc(g.d)}</p><div class="tags">${g.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  ${g.locs?`<div class="locs">${g.locs.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}<a class="play" href="${href}">${L[lang].play}</a></div></article>`}
function render(){const t=L[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';try{localStorage.setItem('byd-lang3',lang)}catch(e){}
  document.getElementById('root').innerHTML=`
  <div class="top"><a class="brandmark" href="./"><img src="brand/icon-192.png" alt="" width="42" height="42"><span class="mini"><b>TAG</b>SHIM</span></a><span id="instTop"></span><div class="langs" role="group" aria-label="Language">${LANGS.map(([k,l])=>`<button type="button" data-l="${k}" class="${k===lang?'on':''}">${l}</button>`).join('')}</div></div>
  <header class="hero"><img class="heroicon" src="brand/icon-512.png" alt="" width="140" height="140"><h1 class="word"><span class="a">TAGSHIM</span></h1><span class="pill">PLAY ANYWHERE</span>
    <p class="slogan">${t.slogan}</p><button type="button" class="share shtop" id="invTop">🎮 ${t.invite}</button><button type="button" class="shsite" id="shTop">📤 ${t.shareAll}</button><div class="chips">${t.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div><div id="inst"></div></header>
  <a class="nightb" href="night/?lang=${lang}"><img src="night/stars/og.png" alt="" width="1200" height="630" loading="lazy"><span><b>${t.nightT}</b><small>${esc(t.nightP)}</small><i>${t.nightGo}</i></span></a>
  <section><h2>${t.games}</h2><div class="games">${card('donkey','donkey/og.png','donkey/?lang='+lang)}${card('burger','burger/og.png','burger/?lang='+lang)}${card('school','school/og.png','school/?lang='+lang)}${card('soccer','soccer/og.png','soccer/?lang='+lang)}${card('snow','snow/og.png','snow/?lang='+lang)}${card('box','box/og.png','box/?lang='+lang)}${card('villain','villain/og.png','villain/?lang='+lang)}${card('train','train/og.png','train/?lang='+lang)}${card('pirate','pirate/og.png','pirate/?lang='+lang)}${card('dino','dino/og.png','dino/?lang='+lang)}${card('balloon','balloon/og.png','balloon/?lang='+lang)}${card('ghost','ghost/og.png','ghost/?lang='+lang)}${card('pizza','pizza/og.png','pizza/?lang='+lang)}${card('sniper','sniper/og.png','sniper/?lang='+lang)}${card('race','race/og.png','race/?lang='+lang)}</div></section>
  <section><h2>${t.how}</h2><ol class="steps">${t.steps.map(([b,s])=>`<li><b>${esc(b)}</b><span>${esc(s)}</span></li>`).join('')}</ol></section>
  <section class="band"><h2 style="margin:0">${t.bandT}</h2><p>${t.bandP}</p><a class="share" href="https://wa.me/?text=${encodeURIComponent(t.shareText+SITE+'?lang='+lang)}" target="_blank" rel="noopener">💬 ${t.share}</a><span class="link">${SITE.replace('https://','')}</span></section>
  <footer><span><b>Tagshim</b> · Play anywhere</span><span>${t.made} · 2026</span><!--privacy-link-pending--></footer>`;
  document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
  document.getElementById('invTop').onclick=()=>{const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
    const url=SITE+'burger/?room='+code+'&lang='+lang,txt=t.inviteMsg(code),go=()=>{location.href='burger/?mk='+code+'&loc=diner&lang='+lang};
    if(navigator.share){navigator.share({title:'Tagshim',text:txt,url}).then(go,e=>{if(!(e&&e.name==='AbortError'))go()})}else{window.open('https://wa.me/?text='+encodeURIComponent(txt+url),'_blank','noopener');setTimeout(go,300)}};
  document.getElementById('shTop').onclick=async()=>{const url=SITE+'?lang='+lang;try{if(navigator.share){await navigator.share({title:'Tagshim',text:t.shareText,url});return}}catch(e){if(e&&e.name==='AbortError')return}open('https://wa.me/?text='+encodeURIComponent(t.shareText+url),'_blank','noopener')};
  renderInst()}
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;renderInst()});addEventListener('appinstalled',()=>{dip=null;renderInst()});
function renderInst(){const el=document.getElementById('instTop');if(!el)return;const t=L[lang],ua=navigator.userAgent;
  const app=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(app){el.innerHTML='';return}
  const and=/Android/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),inApp=/Snapchat|Instagram|FBAN|FBAV|FB_IAB|Line\/|WhatsApp|TikTok|musical_ly|; wv\)/i.test(ua);
  if(!dip&&!and&&!ios){el.innerHTML='';return}
  el.innerHTML=`<button type="button" class="instTop" id="instB">📲 ${t.instS}</button>`;
  document.getElementById('instB').onclick=async()=>{
    if(dip){const p=dip;dip=null;try{await p.prompt();await p.userChoice}catch(e){}renderInst();return}
    if(and&&inApp){location.href=`intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end`;return}
    const msg=ios?(/CriOS/.test(ua)?t.iosChrome:t.ios):t.andr;
    const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="sheetc"><img src="brand/icon-192.png" alt="" width="64" height="64"><b>${t.inst}</b><p>${msg}</p><p class="insthint">${t.instHint}</p><button type="button" class="inst">${t.close}</button></div>`;
    d.onclick=e=>{if(e.target===d||e.target.tagName==='BUTTON')d.remove()};document.body.appendChild(d)}}
render();
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script>
