 ctx.textAlign='right';ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W-216,14,200,40);ctx.fillStyle='#f3e9dc';ctx.font='900 20px Impact,sans-serif';ctx.fillText(`РАУНД ${G.round} · ${G.wins.me||0}:${G.wins.them||0}`,W-28,42);

 g.clearRect(0,0,140,14);return c}

 document.getElementById('y18').onclick=()=>{au();LS.set('age',1);showMenu()};document.getElementById('n18').onclick=()=>{location.href='https://games.tagshim.com/'}}
function showMenu(){state='menu';$ui.hidden=false;$ui.innerHTML=`<div class="card"><h1>УЛИЦА</h1><h2 style="color:#c8202a">КРОВЬ НА АСФАЛЬТЕ</h2><p class="sub">Выбери пацана</p><div class="heroes" id="hs"></div>
 <div class="row"><button class="mb ${mode==='ffa'?'on':''}" data-m="ffa">Без правил · каждый сам</button><button class="mb ${mode==='team'?'on':''}" data-m="team">Стенка · 2 на 2</button><button class="mb ${mode==='skate'?'on':''}" data-m="skate">Скейты · сбей с доски</button><button class="mb ${mode==='bike'?'on':''}" data-m="bike">Велики · уйди от ментов</button><button class="mb ${mode==='zavod'?'on':''}" data-m="zavod">Завод · укради ящик</button><button class="mb ${mode==='salon'?'on':''}" data-m="salon">Видеосалон · отожми</button></div>
 <div class="row"><button id="bl" class="${BLOOD?'on':''}">Кровь: ${BLOOD?'вкл':'выкл'}</button><button class="pri" id="go">В БОЙ</button></div>
 <p class="sub" style="margin-top:14px;font-size:13px">Компьютер: WASD или стрелки · удар — F или левая кнопка мыши · пинок — G или правая кнопка. Оружие подбирается само. Завод: прячься от фонарей, бей со спины; с ящиком удар — бросить ящик. Видеосалон: стой в круге у телевизора.</p></div>`;
 const hs=document.getElementById('hs');HEROES.forEach((h,i)=>{const b=document.createElement('button');b.className='hb'+(i===myHero?' on':'');b.appendChild(heroCanvas(i));b.insertAdjacentHTML('beforeend',`<b>${h.name}</b><small>${h.desc}</small>`);b.onclick=()=>{myHero=i;LS.set('hero',i);showMenu()};hs.appendChild(b)});
 $ui.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{mode=b.dataset.m;LS.set('mode',mode);G=null;paintBG();showMenu()});
 document.getElementById('bl').onclick=()=>{BLOOD=!BLOOD;LS.set('blood',BLOOD);showMenu()};
 document.getElementById('go').onclick=()=>{au();G=null;start()}}

function roundEnd(){const w=G.wins;if((w.me||0)>=2||(w.them||0)>=2){state='end';const won=(w.me||0)>=2;$ui.hidden=false;document.getElementById('touch').hidden=true;
  $ui.innerHTML=`<div class="card"><h1 style="text-shadow:4px 4px 0 ${won?'#e8b23a':'#c8202a'}">${endTitle(won)}</h1><p class="sub">Счёт ${w.me||0}:${w.them||0} · нокаутов: ${G.F[0].kills}</p><div class="row"><button class="pri" id="again">Ещё раз</button><button id="menu">Меню</button></div></div>`;
  document.getElementById('again').onclick=()=>{G=null;start()};document.getElementById('menu').onclick=showMenu}
 else newRound()}

addEventListener('keyup',e=>{keys[e.code]=false});

cv.addEventListener('contextmenu',e=>e.preventDefault());
{const st=document.getElementById('stick'),kn=document.getElementById('knob');let id=null,cx=0,cy=0;

 const mv=e=>{if(e.pointerId!==id)return;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),m=60;if(d>m){dx=dx/d*m;dy=dy/d*m}kn.style.transform=`translate(${dx}px,${dy}px)`;pad.mx=Math.abs(dx)>12?dx/m:0;pad.my=Math.abs(dy)>12?dy/m:0};
 st.addEventListener('pointermove',mv);const up=e=>{if(e.pointerId!==id)return;id=null;pad.mx=pad.my=0;kn.style.transform=''};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 document.getElementById('bA').addEventListener('pointerdown',e=>{e.preventDefault();au();if(state==='play')attack(G.F[0])});

 try{if(state==='play'&&G){update(dt);render(t)}

 requestAnimationFrame(loop)}

window.__r89={get G(){return G},start,attack:()=>attack(G.F[0]),sim:(n,dt)=>{for(let i=0;i<n&&G&&state==='play';i++)update(dt||1/60)},render:()=>render(performance.now()/1000),see:(g,e)=>seesIt(coneOf(g),e)};
