function body(c,id){const [x,y]=spawnMap()[c];return {id,c,x,y,kx:0,ky:0,stun:0,face:1,moving:false,score:0}}
function move(b,dx,dy,dt,others){const c=CH[b.c];if(b.stun>0){b.stun-=dt;dx=dy=0}
  const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  if(LOC==='box'&&b.score<=0){dx=dy=0}const spd=c.sp*(b.hat==='cap'&&(LOC==='diner'||LOC==='box')?1.12:1);b.x+=(dx*spd+b.kx)*dt;b.y+=(dy*spd+b.ky)*dt;const f=Math.pow(.015,dt);b.kx*=f;b.ky*=f;
  b.moving=l>.15;if(Math.abs(dx)>.2)b.face=dx<0?-1:1;
  if(others)for(const o of others){if(o===b)continue;const ddx=b.x-o.x,ddy=b.y-o.y,d=Math.hypot(ddx,ddy),m=c.r+CH[o.c].r;
    if(d<m&&d>0){const push=(m-d)*CH[o.c].mass/(CH[o.c].mass+c.mass);b.x+=ddx/d*push;b.y+=ddy/d*push}}
  for(const o of tColl()){const ddx=b.x-o.x,ddy=b.y-o.y,d=Math.hypot(ddx,ddy),m=c.r+30;if(d<m&&d>0){b.x+=ddx/d*(m-d);b.y+=ddy/d*(m-d)}}
  collide(b)}
function collide(b,rad){const r=rad||CH[b.c].r;
  if(b.x<r+14){b.x=r+14;b.kx=Math.abs(b.kx)*.5}if(b.x>AW-r-14){b.x=AW-r-14;b.kx=-Math.abs(b.kx)*.5}
  if(b.y<TOP+r-20){b.y=TOP+r-20;b.ky=Math.abs(b.ky)*.5}if(b.y>AH-r-14){b.y=AH-r-14;b.ky=-Math.abs(b.ky)*.5}
  if(LOC==='soccer'&&b.x>GX-r){b.x=GX-r;b.kx=-Math.abs(b.kx)*.5}
  if(LOC==='box'){if(b.x<RX0+r){b.x=RX0+r;b.kx=Math.abs(b.kx)*.6}if(b.x>RX1-r){b.x=RX1-r;b.kx=-Math.abs(b.kx)*.6}if(b.y<RY0+r-20){b.y=RY0+r-20;b.ky=Math.abs(b.ky)*.6}if(b.y>RY1-6){b.y=RY1-6;b.ky=-Math.abs(b.ky)*.6}}
  for(const t of TABLES){const dx=b.x-t.x,dy=b.y-t.y,d=Math.hypot(dx,dy),m=t.r+r;if(d<m&&d>0){b.x=t.x+dx/d*m;b.y=t.y+dy/d*m}}
  const rr2=r*.8;for(const q of RECTS){const cx=clamp(b.x,q.x,q.x+q.w),cy=clamp(b.y,q.y,q.y+q.h),dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);
    if(d<rr2){if(d===0){const l=b.x-q.x,rg=q.x+q.w-b.x,tp=b.y-q.y,bt=q.y+q.h-b.y,m=Math.min(l,rg,tp,bt);if(m===l)b.x=q.x-rr2;else if(m===rg)b.x=q.x+q.w+rr2;else if(m===tp)b.y=q.y-rr2;else b.y=q.y+q.h+rr2}
      else{b.x=cx+dx/d*rr2;b.y=cy+dy/d*rr2}}}}

let client,room,isHost=false,phase='lobby';
let lobbyPlayers=new Map(); // id -> {name,c,bot}
let useBots=3;function botSlots(){const free=ORDER.filter(c=>![...lobbyPlayers.values()].some(p=>p.c===c));return free.slice(0,Math.max(0,Math.min(+useBots||0,4-lobbyPlayers.size)))}
function topic(){return NS+room}
function send(m,qos=0){m.from=me.id;try{client&&client.publish(topic(),JSON.stringify(m),{qos})}catch(e){}}
function connect(code,cb){room=code;if(!window.mqtt){fail(T('errLib'));return}
  client=mqtt.connect(BROKER,{clientId:'brg_'+me.id,clean:true,reconnectPeriod:2000,connectTimeout:8000});let first=true;
  client.on('connect',()=>{client.subscribe(topic(),{qos:1},()=>{if(first){first=false;cb()}else if(!isHost)send({t:'hi',name:me.name},1)})});
  client.on('message',(t,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}if(m.from===me.id&&!isHost)return;onMsg(m)});
  client.on('error',()=>{});setTimeout(()=>{if(first)fail(T('errConn'))},10000)}
function fail(t){redraw=()=>fail(t);show('app');app.innerHTML=`<div style="font-size:64px">😵</div><h2>${esc(t)}</h2><button onclick="location.reload()">${T('reload')}</button>`}
addEventListener('pagehide',()=>send({t:'bye'},1));

function onMsg(m){if(followGoto(m))return;if(m.t==='lobby'&&m.players&&m.players.some(p=>p.id===me.id))seenMe=true;
  if(['lobby','round','rres','end','hb','st','start','kb'].includes(m.t))markHost(m);
  if(m.t==='bye'&&!isHost&&hostId&&m.from===hostId&&phase!=='end'){hostGone();return}
  if(isHost){
    if(m.t==='hi'&&m.from!==me.id){if(!lobbyPlayers.has(m.from)){const humans=[...lobbyPlayers.values()].length;if(humans>=4){send({t:'full',to:m.from},1);return}
        lobbyPlayers.set(m.from,{name:m.name,c:freeChar(),hat:m.hat||null})}else{const q=lobbyPlayers.get(m.from);q.name=m.name;if('hat' in m)q.hat=m.hat||null}broadcastLobby()}
    else if(m.t==='hat'){const q=lobbyPlayers.get(m.from);if(q)q.hat=HATS[m.h]?m.h:null;if(T0)T0.hats[m.from]=HATS[m.h]?m.h:null;if(phase==='lobby')broadcastLobby()}
    else if(m.t==='pick'){const p=lobbyPlayers.get(m.from);if(p&&phase==='lobby'&&![...lobbyPlayers].some(([id,q])=>id!==m.from&&q.c===m.c)){p.c=m.c;broadcastLobby()}}
    else if(m.t==='pos'&&G&&G.P[m.from]&&m.from!==me.id){const b=G.P[m.from];b.x=m.x;b.y=m.y;b.moving=!!m.m;b.face=m.f||1;b.seen=performance.now()}
    else if(m.t==='low'&&G&&m.from!==me.id){hostLow(m.from)}
    else if(m.t==='push'&&G&&m.from!==me.id){const b=G.P[m.from];if(b&&m.ax!=null){b.ax=m.ax;b.ay=m.ay}hostPush(m.from)}
    else if(m.t==='sync'&&T0&&matchPhase==='inter'&&T0.lastRR){send(T0.lastRR,1)}
    else if(m.t==='sync'&&G&&T0){const rr=Object.values(G.P).map(b=>{const x=T0.all.find(y=>y[0]===b.id);return [b.id,b.c,b.name,b.bot?1:0,b.hat||null]});send({t:'start',roster:rr,round:T0.round,to:m.from,loc:LOC},1)}
    else if(m.t==='grab'&&G&&matchPhase==='play'){const b=G.P[m.from],i=G.B.findIndex(g=>g.id===m.id);
      if(b&&i>=0&&b.stun<=0){const g=G.B[i],reach=CH[b.c].r+30+CH[b.c].pick+(b.hat==='top'&&LOC==='diner'?32:0)+110;
        if(Math.hypot(g.x-m.x,(g.y-12)-(m.y-30))<reach&&Math.hypot(b.x-m.x,b.y-m.y)<260){G.B.splice(i,1);b.score++;b.x=m.x;b.y=m.y;evq.push(['e',m.from,Math.round(g.x),Math.round(g.y)])}}}
    else if(m.t==='bye'){lobbyPlayers.delete(m.from);if(G&&G.P[m.from])delete G.P[m.from];if(phase==='lobby')broadcastLobby()}
  }
  if(m.t==='full'&&m.to===me.id)fail(T('full'));
  else if(m.t==='lobby'&&!isHost){if(m.loc&&LOCS[m.loc]&&m.loc!==FIXED){FIXED=m.loc;applyLang();send({t:'hat',h:wearHat()},1);history.replaceState(null,'',location.pathname+'?loc='+FIXED+'&room='+room+'&lang='+lang)}lobbyPlayers=new Map(m.players.map(p=>[p.id,{name:p.name,c:p.c,hat:p.hat}]));useBots=m.bots;setLoc(m.loc);if(phase==='lobby'||phase==='end')lobby()}
  else if(m.t==='start'&&!isHost&&!(m.again&&phase==='play'&&curRound===m.round&&matchPhase!=='inter')&&(!m.to||m.to===me.id)&&!(m.to&&phase==='play'&&matchPhase!=='inter'))startLocal(m.roster,m.round,m.loc);
  else if(m.t==='rr'&&!isHost&&phase==='play'){const k=m.round+'|'+JSON.stringify(m.scores);if(matchPhase==='inter'&&showInter.k===k)return;showInter.k=k;matchPhase='inter';showInter(m)}
  else if(m.t==='st'&&!isHost){if((phase!=='play'&&phase!=='gone'&&phase!=='end'||phase==='play'&&matchPhase==='inter')&&!syncAsked){syncAsked=true;send({t:'sync'},1);setTimeout(()=>syncAsked=false,3000)}else if(phase==='play')applyState(m)}
  else if(m.t==='kb'&&m.to===me.id&&mine){mine.kx=m.vx;mine.ky=m.vy;mine.stun=m.s;sndPush();vib([80,40,80])}
  else if(m.t==='end'&&!isHost&&phase==='play')endScreen(m.board);
}
function freeChar(){const used=new Set([...lobbyPlayers.values()].map(p=>p.c));return ORDER.find(c=>!used.has(c))||ORDER[0]}
function broadcastLobby(){send({t:'lobby',loc:LOC,bots:useBots,players:[...lobbyPlayers].map(([id,p])=>({id,name:p.name,c:p.c,hat:p.hat||null}))},1);if(phase==='lobby')lobby()}

let hostId=null,lastHost=0,watchT=null,autoCreated=false;
function markHost(m){if(!isHost&&m.from!==me.id){hostId=m.from;lastHost=performance.now()}}
function startWatch(){clearInterval(watchT);lastHost=performance.now();watchT=setInterval(()=>{if(isHost||phase==='end'||phase==='gone')return;if(performance.now()-lastHost>9000)hostGone()},1500)}
function baseLink(){return location.origin+DIRS[FIXED]+'?lang='+lang}
function createOwn(){location.href=location.pathname+'?lang='+lang+'&create=1&loc='+FIXED}
function hostGone(){clearInterval(watchT);try{client&&client.end(true)}catch(e){}client=null;phase='gone';redraw=hostGone;show('app');
  app.innerHTML=`<div style="font-size:64px;line-height:1">👋</div><h2>${T(hostId?'hostGone':'noRoom')}</h2><p>${T('ownHint')}</p><button id="own">${T('createOwn')}</button>`;
  document.getElementById('own').onclick=createOwn}
setInterval(()=>{if(isHost&&client)send({t:'hb'})},3000);

home();
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script>
