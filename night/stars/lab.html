<!doctype html><html><body style="margin:0;background:#000"><canvas id=c width=300 height=360></canvas>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/addons/","@pixiv/three-vrm":"./lib/three-vrm.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';import {makeChar,pose} from './chars.js';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});r.outputColorSpace=THREE.SRGBColorSpace;r.setClearColor(0x1a1238);
const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xdfe6ff,0x302050,1.6));const d=new THREE.DirectionalLight(0xffffff,2.3);d.position.set(2,3,2);sc.add(d);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshStandardMaterial({color:0x1b6c3b}));gr.rotation.x=-Math.PI/2;sc.add(gr);
const cam=new THREE.PerspectiveCamera(35,300/360,.1,50);const chars={};
window.shot=async(star,a,t,o,view)=>{if(!chars[star]){chars[star]=await makeChar(star,{kit:'#22e3ff',shorts:'#0b1f3a',sock:'#22e3ff',num:7})}for(const k in chars)sc.remove(chars[k].root);const c=chars[star];sc.add(c.root);pose(c,a,t,o||{});c.vrm.update(0);
 if(view==='side')cam.position.set(4.2,1.1,0);else cam.position.set(2.2,1.4,3.4);cam.lookAt(0,.85,0);r.render(sc,cam);return document.getElementById('c').toDataURL()};
window.ready=true;</script></body></html>
