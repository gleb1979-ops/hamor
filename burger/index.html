const FXI={};let fxReady=false;(()=>{const ks=Object.keys(FXSRC);let n=0;ks.forEach(k=>{const im=new Image();im.onload=()=>{if(++n===ks.length){fxReady=true;for(const [nm,col] of [['star','#ffae00'],['glint','#ffc400'],['puff','#9c8668'],['snow','#ffffff'],['slash','#ffffff'],['red','#ff3c1e']]){const b=FXI['p_'+(nm==='snow'?'puff':nm==='red'?'star':nm)];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.drawImage(b,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,64,64);FXI['t_'+nm]=c}}};im.src=FXSRC[k];FXI[k]=im})})();
let bursts=[],emos=[];
function burst(x,y,kind,n,pw){if(!fxReady)return;n=n||8;pw=pw||1;for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=(120+Math.random()*220)*pw;bursts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.7-60,t:0,life:.45+Math.random()*.3,s:(kind==='puff'||kind==='snow'?60:44)*(0.7+Math.random()*.6)*pw,k:kind,r:Math.random()*6})}}
function emote(id,k,x,y){if(!fxReady||(!FXI['e_'+k]&&!k.startsWith('card'))||(!id&&x==null)||(id&&!view[id]&&x==null))return;emos=emos.filter(e=>!(id&&e.id===id));emos.push({id,k,x,y,t:0})}
function drawFX(g,dt){if(!fxReady)return;
  for(const b of bursts){b.t+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.9;b.vy=b.vy*.9+(b.k==='puff'||b.k==='snow'?-40:120)*dt;const k=b.t/b.life,sz=b.s*(b.k==='puff'||b.k==='snow'?.6+k*.8:1-k*.5);
    g.globalAlpha=Math.max(0,1-k);g.save();g.translate(b.x,b.y-30);g.rotate(b.r+b.t*4);const im=FXI['t_'+b.k];g.drawImage(im,-sz/2,-sz/2,sz,sz);if(b.k!=='puff')g.drawImage(im,-sz/2,-sz/2,sz,sz);g.restore()}
  g.globalAlpha=1;bursts=bursts.filter(b=>b.t<b.life);
  for(const e of emos){e.t+=dt;const v=e.id&&view[e.id];let x=e.x,y=e.y;if(v){x=v.x;y=v.y+headTop(v.c,v.hat)-34}
    const pop=e.t<.15?e.t/.15*1.15:e.t<.25?1.15-(e.t-.15):1,fade=e.t>1.1?Math.max(0,1-(e.t-1.1)/.3):1,w=48*pop,h=57*pop;
    g.globalAlpha=fade;if(e.k.startsWith('card')){g.save();g.translate(x,y-h/2);g.rotate(Math.sin(e.t*5)*.15);g.fillStyle='rgba(0,0,0,.25)';rr(g,-w*.35+4,-h*.5+4,w*.7,h,6);g.fill();g.fillStyle=e.k==='cardY'?'#ffd21f':'#e8231c';rr(g,-w*.35,-h*.5,w*.7,h,6);g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke();g.restore()}else g.drawImage(FXI['e_'+e.k],x-w/2,y-h-Math.sin(e.t*6)*3,w,h)}
  g.globalAlpha=1;emos=emos.filter(e=>e.t<1.4)}
function vxy(id){const v=view[id];return v?[v.x,v.y]:null}

function body(c,id){const [x,y]=spawnMap()[c];return {id,c,x,y,kx:0,ky:0,stun:0,face:1,moving:false,score:0}}
function move(b,dx,dy,dt,others){const c=CH[b.c];if(b.stun>0){b.stun-=dt;dx=dy=0}
  const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  if(LOC==='box'&&b.score<=0){dx=dy=0}const spd=c.sp*(b.hat==='cap'&&(LOC==='diner'||LOC==='box'||LOC==='villain')?1.12:1)*((b.slowU||0)>performance.now()?.5:1);b.x+=(dx*spd+b.kx)*dt;b.y+=(dy*spd+b.ky)*dt;const f=Math.pow(.015,dt);b.kx*=f;b.ky*=f;
  b.moving=l>.15;if(Math.abs(dx)>.2)b.face=dx<0?-1:1;
  if(others)for(const o of others){if(o===b)continue;const ddx=b.x-o.x,ddy=b.y-o.y,d=Math.hypot(ddx,ddy),m=c.r+CH[o.c].r;
    if(d<m&&d>0){const push=(m-d)*CH[o.c].mass/(CH[o.c].mass+c.mass);b.x+=ddx/d*push;b.y+=ddy/d*push}}
  for(const o of tColl()){const ddx=b.x-o.x,ddy=b.y-o.y,d=Math.hypot(ddx,ddy),m=c.r+30;if(d<m&&d>0){b.x+=ddx/d*(m-d);b.y+=ddy/d*(m-d)}}
  collide(b)}
function collide(b,rad){const r=rad||CH[b.c].r;
  if(b.x<r+14){b.x=r+14;b.kx=Math.abs(b.kx)*.5}if(b.x>AW-r-14){b.x=AW-r-14;b.kx=-Math.abs(b.kx)*.5}
  if(b.y<TOP+r-20){b.y=TOP+r-20;b.ky=Math.abs(b.ky)*.5}if(b.y>AH-r-14){b.y=AH-r-14;b.ky=-Math.abs(b.ky)*.5}
  if(LOC==='soccer'&&b.x>GX-r){b.x=GX-r;b.kx=-Math.abs(b.kx)*.5}
  if(LOC==='box'){if(b.x<RX0+r){b.x=RX0+r;b.kx=Math.abs(b.kx)*.6}if(b.x>RX1-r){b.x=RX1-r;b.kx=-Math.abs(b.kx)*.6}if(b.y<RY0+r-20){b.y=RY0+r-20;b.ky=Math.abs(b.ky)*.6}if(b.y>RY1-6){b.y=RY1-6;b.ky=-Math.abs(b.ky)*.6}}
  for(const t of TABLES){const dx=b.x-t.x,dy=b.y-t.y,d=Math.hypot(dx,dy),m=t.r+r;if(d<m&&d>0){b.x=t.x+dx/d*m;b.y=t.y+dy/d*m}}
  const rr2=r*.8;for(const q of RECTS){const cx=clamp(b.x,q.x,q.x+q.w),cy=clamp(b.y,q.y,q.y+q.h),dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);
    if(d<rr2){if(d===0){const l=b.x-q.x,rg=q.x+q.w-b.x,tp=b.y-q.y,bt=q.y+q.h-b.y,m=Math.min(l,rg,tp,bt);if(m===l)b.x=q.x-rr2;else if(m===rg)b.x=q.x+q.w+rr2;else if(m===tp)b.y=q.y-rr2;else b.y=q.y+q.h+rr2}
      else{b.x=cx+dx/d*rr2;b.y=cy+dy/d*rr2}}}}

  }
  if(m.t==='full'&&m.to===me.id)fail(T('full'));

  if(brain.react<=0){brain.react=.5+Math.random()*.7;if(Math.random()<.18){brain.target=null;brain.idle=.4+Math.random()*.5;return [0,0]}let best=null,bd=1e9;for(const g of G.B){const d=Math.hypot(g.x-b.x,g.y-b.y)+Math.random()*120;if(d<bd){bd=d;best=g}}brain.target=best}
  let dx=0,dy=0;if(brain.target&&G.B.includes(brain.target)){dx=brain.target.x-b.x;dy=brain.target.y-b.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d}
  brain.wob+=dt*3;dx+=Math.cos(brain.wob)*.25;dy+=Math.sin(brain.wob)*.25;
  for(const t of TABLES){const ox=b.x-t.x,oy=b.y-t.y,d=Math.hypot(ox,oy);if(d<t.r+70){dx+=ox/d*.9;dy+=oy/d*.9}}
  const others=Object.values(G.P).filter(o=>o!==b);
  if(matchPhase==='play'&&Math.random()<dt*.9&&others.some(o=>Math.hypot(o.x-b.x,o.y-b.y)<CH[b.c].r+CH[o.c].r+40))hostPush(b.id);
  return [dx*.6,dy*.6]}
function hostTick(dt){if(!G||matchPhase==='inter')return;const P=G.P;
  if(matchPhase==='count'){G.count-=dt;timeLeft=G.count;const n=Math.ceil(G.count);if(n!==lastCount&&n>0){lastCount=n;sndBeep(0);flashBig(n,900)}
    if(G.count<=0){matchPhase='play';G.t=RS();sndBeep(1);flashBig(T('go'),700);document.getElementById('tip').hidden=true}}
  else if(matchPhase==='play'){G.t-=dt;timeLeft=G.t;
    if(G.TC)(LOC==='box'?refTick:teacherTick)(dt);if(G.ball)ballTick(dt);if(G.SB)snowTick(dt);
    for(const id in P){const b=P[id];if(b.bot){const [dx,dy]=botThink(b,dt);move(b,dx,dy,dt,Object.values(P))}else if(id!==me.id&&b.stun>0)b.stun-=dt}
    if(LOC==='villain')trapTick();
    for(const id in P){const b=P[id];if(b.stun>0||(LOC==='villain'&&id===G.vil))continue;const reach=CH[b.c].r+26+CH[b.c].pick+(b.hat==='top'&&(LOC==='diner'||LOC==='villain')?32:0);
      for(let i=G.B.length-1;i>=0;i--){const g=G.B[i];if(Math.hypot(g.x-b.x,(g.y-12)-(b.y-30))<reach){G.B.splice(i,1);b.score++;evq.push(['e',id,Math.round(g.x),Math.round(g.y)]);keyGot()}}}
    if(LOC==='villain'&&G.t<=0&&!G.res)G.res='time';if(G.t<=0||(LOC==='villain'?!!G.res:LOC==='box'?Object.values(P).filter(b=>b.score>0).length<=1:LOC==='school'?G.kicks>=LOCS.school.goal:LOC==='soccer'?G.goals>=LOCS.soccer.goal:LOC==='snow'?G.hits>=LOCS.snow.goal:G.B.length===0)){matchPhase='end'}}
  // views for host render
  for(const id in P){const b=P[id],v=view[id];if(!v)continue;if(id!==me.id){v.tx=b.x;v.ty=b.y;v.moving=b.moving;v.face=b.face;v.stun=b.stun>0?1:0}v.score=b.score}
  burgers=G.B.map(g=>[g.id,Math.round(g.x),Math.round(g.y)]);if(LOC==='villain'){vKeys=G.keys;trapsV=G.TR.map(t=>[t.x,t.y,TRAPS.indexOf(t.ty),t.arm<performance.now()?1:0])}
  if(G.SB){const nv={};for(const b of G.SB)nv[b.id]={x:b.x,y:b.y,vx:0,vy:0,mega:b.mega};sbV=nv;starV=G.star?{x:G.star.x,y:G.star.y}:null;myMega=!!(G.P[me.id]&&G.P[me.id].mega)}
  if(G.ball){ballV={x:G.ball.x,y:G.ball.y,rot:G.ball.rot};keeperV={y:G.keeper.y,save:G.keeper.save>0,moving:G.keeper.moving}}
  tview=G.TC?G.TC.map(T=>({x:T.x,y:T.y,tx:T.x,ty:T.y,a:Math.atan2(T.fy,T.fx),st:T.st,k:T.k})):[];
  if(evq.length){for(const e of evq)handleEvHost(e)}
  stAcc+=dt;if(stAcc>=.09||matchPhase==='end'){stAcc=0;
    send({t:'st',ph:matchPhase==='end'?'play':matchPhase,tl:Math.max(0,+timeLeft.toFixed(2)),B:burgers,ev:evq,TC:G.TC?G.TC.map(T=>[Math.round(T.x),Math.round(T.y),+Math.atan2(T.fy,T.fx).toFixed(2),T.st,TKINDS.indexOf(T.k)]):undefined,SB:G.SB?G.SB.map(b=>[b.id,Math.round(b.x),Math.round(b.y),Math.round(b.vx),Math.round(b.vy),b.mega?1:0]):undefined,ST:G.star?[Math.round(G.star.x),Math.round(G.star.y)]:undefined,MG:G.SB?Object.keys(G.P).filter(id=>G.P[id].mega):undefined,BL:G.ball?[Math.round(G.ball.x),Math.round(G.ball.y),Math.round(G.ball.vx),Math.round(G.ball.vy),Math.round(G.keeper.y),G.keeper.save>0?1:0,G.ball.frozen>0?1:0]:undefined,
      KY:G.keys,TR:G.TR?G.TR.map(t=>[Math.round(t.x),Math.round(t.y),TRAPS.indexOf(t.ty),t.arm<performance.now()?1:0]):undefined,P:Object.values(P).map(b=>[b.id,Math.round(b.x),Math.round(b.y),b.score,b.stun>0?1:0,b.moving?1:0,b.face])});evq=[]}
  if(matchPhase==='end')endRound()}
const handledHost=new WeakSet();
function handleEvHost(e){if(handledHost.has(e))return;handledHost.add(e);handleEv(e)}

/* ================= end ================= */
let fxParts=[];const fx=document.getElementById('fx'),fctx=fx.getContext('2d');
function confetti(){fx.width=innerWidth*DPR;fx.height=innerHeight*DPR;fctx.setTransform(DPR,0,0,DPR,0,0);const cols=['#ffc531','#e8412c','#5cc560','#4f8cff','#ff6fae'];
  for(let i=0;i<160;i++)fxParts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,c:cols[i%5],a:Math.random()*6,s:6+Math.random()*6});
  (function f(){fctx.clearRect(0,0,innerWidth,innerHeight);for(const p of fxParts){p.x+=p.vx;p.y+=p.vy;p.a+=.1;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fctx.restore()}
    fxParts=fxParts.filter(p=>p.y<innerHeight+30);if(fxParts.length)requestAnimationFrame(f);else fctx.clearRect(0,0,innerWidth,innerHeight)})()}
function endScreen(board,again){phase='end';redraw=()=>endScreen(board,1);show('app');stickId=null;knob.style.transform='';input.dx=input.dy=0;
  document.getElementById('inter').hidden=true;const top=board[0],iWin=top&&top[0]===me.id;let medalLine='';

  const medalIcons=[medalImg(0,34),medalImg(1,30),medalImg(2,28),'🍟'];let rank=0;
  app.innerHTML=`<div style="font-size:64px;line-height:1">${iWin&&fxReady?medalImg(0,64):'🏆'}</div><h1>${iWin?T('youWin'):esc(T('winner')(top?top[1]:'?'))}</h1>${medalLine?`<p style="color:var(--mustard);font-weight:700;font-size:18px">${medalLine}</p>`:''}<ol class="podium" id="pod"></ol>
    <div class="row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent((LOC==='villain'?T('shareV'):LOC==='box'?T('shareBox'):LOC==='school'?T('shareSchool'):LOC==='soccer'?T('shareSoccer'):LOC==='snow'?T('shareSnow'):T('shareText'))(top?top[1]:'',top?top[3]:0)+' '+baseLink())}" target="_blank" rel="noopener">${T('share')}</a>
    ${isHost?`<button id="ag">${T('again')} ${LOCS[FIXED].icon}</button><button class="ghost" id="lo">${T('lobbyBtn')}</button>`:''}</div>${isHost?picker(FIXED):''}${isHost?'':`<p class="status">${T('againHost')}</p><button class="ghost" id="own2">${T('createOwn')}</button>`}`;

  const o2=document.getElementById('own2');if(o2)o2.onclick=createOwn;
  if(isHost)bindPicker(switchTo);if(isHost){document.getElementById('ag').onclick=()=>{audio();goFull();hostStart()};document.getElementById('lo').onclick=()=>{phase='lobby';broadcastLobby()}}}

/* ---------- room watch: host gone / create own room ---------- */
let hostId=null,lastHost=0,watchT=null,autoCreated=false;

setInterval(()=>{if(isHost&&client)send({t:'hb'})},3000);

home();
