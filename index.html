<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кто хамор? 🫏</title>
<meta property="og:title" content="Кто хамор? 🫏">
<meta property="og:description" content="Жми на морковку быстрее всех. Последний — חמור!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;500;700&display=swap">
<style>
:root{--bg:#14101f;--panel:#221a35;--fg:#f6f1ff;--muted:#a99cc4;--hot:#ff3d7f;--sun:#ffc93c;--line:#3a2e55;--ok:#25d366;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#app{position:relative;height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;text-align:center;padding-block:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,48px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:clamp(18px,5vw,24px);margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);max-width:34ch;line-height:1.45}
.big{font-size:72px;line-height:1}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:17px;background:var(--hot);color:#fff;box-shadow:0 6px 0 #a3194b;text-decoration:none;display:inline-block}
button:active{transform:translateY(3px);box-shadow:0 3px 0 #a3194b}
button:disabled{opacity:.4}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.ghost{background:transparent;color:var(--fg);box-shadow:none;border:2px solid var(--line)}
.wa{background:var(--ok);color:#0b2a17;box-shadow:0 6px 0 #128c4a}
input{font:inherit;padding:13px 18px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--fg);width:min(100%,320px);text-align:center}
.col{display:grid;gap:10px;width:min(100%,320px)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.code{font-family:var(--display);font-size:40px;letter-spacing:.2em;color:var(--sun)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:min(100%,380px)}
.list li{display:flex;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-variant-numeric:tabular-nums}
.list li.me{border-color:var(--sun)}
.list li.loser{border-color:var(--hot);background:#ff3d7f22;font-weight:700}
.hud{position:absolute;top:12px;left:0;right:0;z-index:5;pointer-events:none;display:grid;gap:6px;justify-items:center}
#pad{position:fixed;inset:0;z-index:4}
.tgt{position:absolute;width:88px;height:88px;padding:0;font-size:54px;line-height:88px;background:var(--sun);box-shadow:0 6px 0 #b8860b;animation:pop .16s both}
@keyframes pop{from{transform:scale(.2)}}
.status{font-size:13px;color:var(--muted)}
.err{color:var(--hot)}
@media (prefers-reduced-motion:reduce){.tgt{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(()=>{
const ROUNDS=3, BROKER='wss://broker.emqx.io:8084/mqtt', NS='byd-hamor/v1/';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const me={id:rid(),name:''};
try{me.name=localStorage.getItem('hamor-name')||''}catch(e){}

/* ---------- particles ---------- */
const fx=document.getElementById('fx'),ctx=fx.getContext('2d');let W,H,DPR=Math.min(2,devicePixelRatio||1),parts=[],running=false;
function size(){W=innerWidth;H=innerHeight;fx.width=W*DPR;fx.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}size();addEventListener('resize',size);
const cache={};function sprite(e){if(cache[e])return cache[e];const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');
  g.font='72px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,48,54);return cache[e]=c}
function burst(x,y,set,n,pw=1){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(4+Math.random()*12)*pw;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6*pw,r:(Math.random()-.5)*.3,a:0,sz:24+Math.random()*34,e:set[i%set.length],life:1,g:.32})}loop()}
function rain(set,n){for(let i=0;i<n;i++)parts.push({x:Math.random()*W,y:-60-Math.random()*H,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,r:(Math.random()-.5)*.1,a:0,sz:30+Math.random()*30,e:set[i%set.length],life:1,g:.12,pile:1});loop()}
function loop(){if(!running){running=true;requestAnimationFrame(step)}}
function step(){ctx.clearRect(0,0,W,H);for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a+=p.r;
  if(p.y>H-p.sz/2&&p.vy>0){p.y=H-p.sz/2;if(p.pile){p.vy=0;p.vx=0;p.r=0;p.life-=.004}else{p.vy*=-.45;p.vx*=.7;p.life-=.18}}
  ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.drawImage(sprite(p.e),-p.sz/2,-p.sz/2,p.sz,p.sz);ctx.restore()}
  parts=parts.filter(p=>p.life>0&&p.y<H+200);if(parts.length)requestAnimationFrame(step);else{running=false;ctx.clearRect(0,0,W,H)}}
let ac;function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}}
function blip(f){if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.8,t+.08);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.13)}catch(e){}}
function boom(){try{navigator.vibrate&&navigator.vibrate([60,40,120])}catch(e){}if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(40,t+.5);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.6)}catch(e){}}
function rank(ms){return ms<330?'🐆':ms<450?'🐎':ms<600?'🐢':'🫏'}

/* ---------- network ---------- */
let client,room,isHost=false,players=new Map(),results={},round=0,phase='lobby',hostTimer;
function topic(){return NS+room}
function send(m){m.from=me.id;client&&client.publish(topic(),JSON.stringify(m),{qos:1})}
function connect(code,cb){room=code;
  if(!window.mqtt){fail('Не загрузилась библиотека связи. Проверь интернет и обнови страницу.');return}
  client=mqtt.connect(BROKER,{clientId:'hamor_'+me.id,clean:true,reconnectPeriod:2000,connectTimeout:8000});
  let first=true;
  client.on('connect',()=>{client.subscribe(topic(),{qos:1},()=>{if(first){first=false;cb()}else hello()})});
  client.on('message',(t,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}onMsg(m)});
  client.on('error',()=>{});
  setTimeout(()=>{if(first)fail('Не получилось подключиться к игре. Попробуй ещё раз через минуту.')},10000)}
function fail(t){app.innerHTML=`<div class="big">😵</div><h2>${esc(t)}</h2><button onclick="location.reload()">Обновить</button>`}
function hello(){send({t:'hi',name:me.name,host:isHost})}

function onMsg(m){
  if(m.t==='hi'){if(!players.has(m.from)||players.get(m.from).name!==m.name){players.set(m.from,{name:m.name,host:!!m.host})}
    if(isHost)broadcastLobby();else if(phase==='lobby')lobby()}
  else if(m.t==='lobby'&&!isHost){players=new Map(m.players.map(p=>[p.id,{name:p.name,host:p.host}]));if(phase==='lobby')lobby()}
  else if(m.t==='round'){phase='play';playRound(m)}
  else if(m.t==='res'&&isHost){(results[m.round]=results[m.round]||{})[m.from]=m.ms;checkRound()}
  else if(m.t==='end'){phase='end';final(m.board)}
  else if(m.t==='bye'){players.delete(m.from);if(isHost)broadcastLobby()}}
function broadcastLobby(){send({t:'lobby',players:[...players].map(([id,p])=>({id,name:p.name,host:p.host}))});if(phase==='lobby')lobby()}
addEventListener('pagehide',()=>{try{send({t:'bye'})}catch(e){}});

/* ---------- screens ---------- */
const params=new URLSearchParams(location.search);const joinCode=(params.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
function home(){app.innerHTML=`<div class="big">🫏</div><h1>Кто хамор?</h1>
  <p>${joinCode?'Тебя позвали в игру. Морковка появляется у всех одновременно. Самый медленный станет חמור.':'Онлайн-игра для группы: каждый со своего телефона жмёт на морковку. Самый медленный станет חמור.'}</p>
  ${joinCode?`<div class="code">${esc(joinCode)}</div>`:''}
  <input id="nm" maxlength="16" placeholder="Твоё имя" value="${esc(me.name)}" autocomplete="off">
  <div class="col"><button id="go">${joinCode?'Войти в игру':'Создать игру'}</button></div><p class="status err" id="msg"></p>`;
  const nm=document.getElementById('nm');
  document.getElementById('go').onclick=()=>{const v=nm.value.trim();if(!v){document.getElementById('msg').textContent='Напиши имя, чтобы другие видели, кто хамор.';nm.focus();return}
    audio();me.name=v;try{localStorage.setItem('hamor-name',v)}catch(e){}
    app.innerHTML='<h2>Подключаюсь…</h2>';
    if(joinCode){connect(joinCode,()=>{players.set(me.id,{name:me.name});hello();lobby()})}
    else{isHost=true;const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
      connect(code,()=>{players.set(me.id,{name:me.name,host:true});broadcastLobby()})}}}

function link(){const u=new URL(location.href);u.search='?room='+room;u.hash='';return u.toString()}
function lobby(){const list=[...players].map(([id,p])=>`<li class="${id===me.id?'me':''}"><span>${esc(p.name)}${id===me.id?' (ты)':''}</span><span>${p.host?'👑':'✅'}</span></li>`).join('');
  const inv=`Го играть в «Кто хамор?» 🫏 Кто последний нажмёт — тот хамор! ${link()}`;
  app.innerHTML=`<h2>Комната</h2><div class="code">${esc(room)}</div>
    ${isHost?`<p>Кинь ссылку в группу. Когда все зайдут, жми «Старт».</p><div class="row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(inv)}" target="_blank" rel="noopener">Позвать в WhatsApp</a><button class="ghost" id="cp">Копировать ссылку</button></div>`:'<p>Ждём, пока организатор нажмёт «Старт»…</p>'}
    <ul class="list">${list}</ul><p class="status">В игре: ${players.size}</p>
    ${isHost?`<button id="st" ${players.size<2?'disabled':''}>Старт · ${ROUNDS} раунда</button>`:''}`;
  if(isHost){document.getElementById('cp').onclick=e=>{navigator.clipboard?.writeText(link()).then(()=>e.target.textContent='Скопировано',()=>e.target.textContent=link())};
    document.getElementById('st').onclick=()=>{if(players.size>=2)startGame()}}}

/* host logic */
let total={};
function startGame(){results={};total={};round=0;closed=0;nextRound()}
function nextRound(){round++;if(round>ROUNDS)return endGame();
  send({t:'round',round,delay:1200+Math.random()*2200,x:Math.random(),y:Math.random()});
  clearTimeout(hostTimer);hostTimer=setTimeout(closeRound,6500)}
function checkRound(){const r=results[round]||{};if([...players.keys()].every(id=>id in r)){clearTimeout(hostTimer);setTimeout(closeRound,600)}}
let closed=0;function closeRound(){if(closed===round)return;closed=round;const r=results[round]||{};
  for(const id of players.keys())total[id]=(total[id]||0)+(id in r?r[id]:2000);setTimeout(nextRound,1500)}
function endGame(){const board=[...players].map(([id,p])=>({id,name:p.name,ms:Math.round(total[id]/ROUNDS)})).sort((a,b)=>a.ms-b.ms);send({t:'end',board})}

/* every player */
function playRound(m){app.innerHTML=`<div class="hud"><h2>Раунд ${m.round}/${ROUNDS}</h2><p id="hm">Жди морковку… не жми раньше!</p></div><div id="pad"></div>`;
  const pad=document.getElementById('pad'),hm=document.getElementById('hm');let state='wait',t0,done=false;
  const report=ms=>{if(done)return;done=true;send({t:'res',round:m.round,ms})};
  pad.addEventListener('pointerdown',()=>{if(state!=='wait')return;state='x';clearTimeout(tm);hm.innerHTML='<span class="err">Рано! +1500 мс</span>';try{navigator.vibrate(150)}catch(e){};report(1500)});
  const tm=setTimeout(()=>{if(state!=='wait')return;state='go';const t=document.createElement('button');t.className='tgt';t.textContent='🥕';t.setAttribute('aria-label','Морковка');
    t.style.left=(10+m.x*(W-150))+'px';t.style.top=(130+m.y*Math.max(40,H-300))+'px';pad.appendChild(t);t0=performance.now();
    t.addEventListener('pointerdown',e=>{e.stopPropagation();if(state!=='go')return;state='x';const dt=Math.round(performance.now()-t0);blip(500+Math.max(0,900-dt));
      const b=t.getBoundingClientRect();burst(b.left+44,b.top+44,['🥕','✨'],12,.5);t.remove();hm.textContent=`${dt} мс · ждём остальных`;report(dt)});
    setTimeout(()=>{if(state==='go'){state='x';t.remove();hm.textContent='Проспал! +2000 мс';report(2000)}},2000)},m.delay)}

function final(board){const last=board[board.length-1];const iAm=last&&last.id===me.id;boom();rain(['🫏'],iAm?140:70);
  setTimeout(()=>burst(W/2,H*.4,['🫏','😂','🥕'],100,1.2),300);
  const txt=`В «Кто хамор?» 🫏 хамор сегодня — ${last.name} (${last.ms} мс)! 😂`;
  app.innerHTML=`<div class="big">🫏</div><h1>${iAm?'Ты — хамор! 😂':esc(last.name)+' — хамор!'}</h1>
    <ol class="list">${board.map((r,k)=>`<li class="${k===board.length-1?'loser':r.id===me.id?'me':''}"><span>${k+1}. ${esc(r.name)}</span><span>${r.ms} мс ${rank(r.ms)}</span></li>`).join('')}</ol>
    <div class="row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Похвастаться в группе</a>
    ${isHost?'<button class="ghost" id="rv">Реванш</button>':''}</div>${isHost?'':'<p class="status">Реванш запускает организатор</p>'}`;
  if(isHost)document.getElementById('rv').onclick=()=>{phase='play';startGame()}}

home();
})();
</script>
</body>
</html>
