/* Layout: one column storefront — wordmark hero, promise chips, two game cards, three steps, share band. */
:root{--bg:#170f1c;--panel:#241830;--panel2:#2e2040;--fg:#fff6ec;--muted:#c2b2c9;--mustard:#ffc531;--ketchup:#e8412c;--grass:#4caf50;--line:#3f2d4c;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;

body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 45% at 50% 0%,#3a2552 0%,transparent 70%),radial-gradient(40% 30% at 90% 60%,#3a1f2a 0%,transparent 70%)}

a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mini{font-weight:900;letter-spacing:.06em;font-size:15px}.mini b{color:var(--mustard)}

.hero{text-align:center;display:grid;justify-items:center;gap:14px;padding-top:10px}
.word{font-weight:900;line-height:.86;margin:0;letter-spacing:-.01em;direction:ltr}

.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:26px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;transition:transform .15s,border-color .15s}

.card>a{display:block}.card img{width:100%;max-width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover;display:block}

footer{text-align:center;color:var(--muted);font-size:13px;display:grid;gap:4px}
footer b{color:var(--fg);direction:ltr;display:inline-block}
@media (prefers-reduced-motion:reduce){.card,.card:hover{transition:none;transform:none}}
</style>
</head>

let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;renderInst()});addEventListener('appinstalled',()=>{dip=null;renderInst()});
function renderInst(){const el=document.getElementById('instTop');if(!el)return;const t=L[lang],ua=navigator.userAgent;
  const app=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(app){el.innerHTML='';return}
  const and=/Android/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),inApp=/Snapchat|Instagram|FBAN|FBAV|FB_IAB|Line\/|WhatsApp|TikTok|musical_ly|; wv\)/i.test(ua);
  if(!dip&&!and&&!ios){el.innerHTML='';return}
  el.innerHTML=`<button type="button" class="instTop" id="instB">📲 ${t.instS}</button>`;

render();
