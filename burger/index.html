gs. Two maps: a fair and the rooftops.',dino:'Up to 4 players. The dinosaurs woke up at night! Collect fossils in the dark, unfreeze your friends and flash the dinos with your camera. Or play infection: whoever the dino catches becomes a dino too!',pirate:'Up to 4 players. Dig up treasure on the X marks, drag the chest to your boat and dodge the skeleton pirates! Two islands and two modes: one crew together, or every pirate for himself.',train:'Up to 4 players. Rob a train in the Wild West! Grab gold sacks from the wagons, carry them to your horse and dodge the train drivers. Two modes: all together, or every robber for himself.',diner:'Up to 4 players. 7 burgers per round: grab and push! Anyone behind the leader is out, until one champion is left.',school:'Up to 4 players. Sneak up behind a teacher and kick! Get spotted — go to the corner. Most kicks wins.',soccer:'Up to 4 players. One ball, a big goal and the PE teacher in goal. Score the most and become champion!',snow:'Up to 4 players. Snowballs, snowmen to hide behind and a golden mega snowball. Best shot wins!',box:'Up to 4 players, all against all. Punch, dodge, and land a low blow when the referee is not looking. Caught twice — disqualified! Last one standing wins.',villain:'Up to 4 players. One of you is a secret villain who hides nasty traps. Collect 20 keys, avoid the traps and catch the villain!'},

  mtag:{nights:'Tagshim Night · до 4 игроков. Сохраните костёр до рассвета! Днём носите дрова, а ночью из леса выходят теневые волки — прогоняйте их и защищайте огонь 3 ночи.',steal:'Tagshim Night · до 4 игроков. Хватай фигурки героев в центре и неси на свою базу. Редкие и легендарные стоят дороже — и любой может пробраться к тебе и украсть их! Запирай базу и толкай воров.',arena:'Tagshim Night · до 4 игроков. Бей и включай суперприём своего героя: телепорт, кусь, тосты, звуковая волна, прыжок на ранце… Побеждает последний на ногах — или играй командой против ботов.',blade:'Tagshim Night · до 4 игроков. Огненный мяч летит в одного игрока — жми ОТБИТЬ в последний момент и отправь его в другого. С каждым отбоем мяч быстрее. Не успел — минус сердце!',bike:'Часть 17: герои удирают из больницы на велосипедах! Гоните к пруду: давите квакающих лягушек за очки, уворачивайтесь от полиции, перепрыгивайте камни и брёвна на бездорожье. До 4 игроков.',hospital:'До 4 игроков. После аварии все попали в больницу! Убегай от медсестры с огромным уколом, пока падают банки и катятся каталки — или донеси утку до туалета и не поскользнись. Упал — весь в какашках!',race:'До 4 игроков. 3 круга ночью! Машина едет сама — рули, жми 🚀 нитро и 💥 выталкивай соперников с дороги.',sniper:'До 4 игроков. Кромешная ночь — ищи остальных в снайперский прицел! 🎯 стреляет, 💣 на миг освещает место. Каждый выстрел тебя выдаёт!',pizza:'До 4 игроков. Хватай ингредиенты из ящиков и собирай пиццу по рецепту! Отнимайте начинку друг у друга или готовьте вместе и гоняйте хитрых крыс.',ghost:'До 4 игроков. Тёмный замок полон привидений! Собирай свечи, свети фонарём и прогоняй привидений вспышкой. Или один из вас сам играет за привидение и пугает всех!',balloon:'До 4 игроков. У каждого 3 шарика. Лопай чужие и береги свои! Или все вместе против колючих ежей. Две карты: ярмарка и крыши.',dino:'До 4 игроков. Ночью ожили динозавры! Собирай окаменелости в темноте, расколдовывай друзей и ослепляй динозавров вспышкой. Или режим «заражение»: кого поймал динозавр, тот сам становится динозавром!',pirate:'До 4 игроков. Выкопай клад на крестике, утащи сундук к своей лодке и не попадись пиратам-скелетам! Два острова и два режима: одна команда или каждый сам за себя.',train:'До 4 игроков. Ограбь поезд на Диком Западе! Хватай мешки с золотом из вагонов, тащи к своей лошади и не попадись машинистам. Два режима: все вместе или каждый сам за себя.',diner:'До 4 игроков. 7 бургеров на раунд: хватай и толкайся! Кто меньше лидера — вылетает, пока не останется один чемпион.',school:'До 4 игроков. Подкрадись к учителю сзади и отвесь поджопник! Попадёшься ему на глаза — в угол. Кто больше всех — чемпион.',soccer:'До 4 игроков. Один мяч, большие ворота и вратарь-физрук. Забей больше всех и стань чемпионом!',snow:'До 4 игроков. Снежки, снеговики-укрытия и золотой мега-снежок. Самый меткий — чемпион!',box:'До 4 игроков, все против всех. Бей, уворачивайся и бей по яйцам, когда судья отвернулся. Заметит 2 раза — дисквалификация! Побеждает последний на ногах.',villain:'До 4 игроков. Один из вас тайный злодей и прячет капканы с гадостями. Соберите 20 ключей, обходите ловушки и поймайте злодея!'},

const FXI={};let fxReady=false;(()=>{const ks=Object.keys(FXSRC);let n=0;ks.forEach(k=>{const im=new Image();im.onload=()=>{if(++n===ks.length){fxReady=true;for(const [nm,col] of [['star','#ffae00'],['glint','#ffc400'],['puff','#9c8668'],['snow','#ffffff'],['slash','#ffffff'],['red','#ff3c1e']]){const b=FXI['p_'+(nm==='snow'?'puff':nm==='red'?'star':nm)];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.drawImage(b,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,64,64);FXI['t_'+nm]=c}}};im.src=FXSRC[k];FXI[k]=im})})();
let bursts=[],emos=[];
function burst(x,y,kind,n,pw){if(!fxReady)return;n=n||8;pw=pw||1;for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=(120+Math.random()*220)*pw;bursts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.7-60,t:0,life:.45+Math.random()*.3,s:(kind==='puff'||kind==='snow'?60:44)*(0.7+Math.random()*.6)*pw,k:kind,r:Math.random()*6})}}
function emote(id,k,x,y){if(!fxReady||(!FXI['e_'+k]&&!k.startsWith('card'))||(!id&&x==null)||(id&&!view[id]&&x==null))return;emos=emos.filter(e=>!(id&&e.id===id));emos.push({id,k,x,y,t:0})}
function drawFX(g,dt){if(!fxReady)return;
  for(const b of bursts){b.t+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.9;b.vy=b.vy*.9+(b.k==='puff'||b.k==='snow'?-40:120)*dt;const k=b.t/b.life,sz=b.s*(b.k==='puff'||b.k==='snow'?.6+k*.8:1-k*.5);
    g.globalAlpha=Math.max(0,1-k);g.save();g.translate(b.x,b.y-30);g.rotate(b.r+b.t*4);const im=FXI['t_'+b.k];g.drawImage(im,-sz/2,-sz/2,sz,sz);if(b.k!=='puff')g.drawImage(im,-sz/2,-sz/2,sz,sz);g.restore()}
  g.globalAlpha=1;bursts=bursts.filter(b=>b.t<b.life);
  for(const e of emos){e.t+=dt;const v=e.id&&view[e.id];let x=e.x,y=e.y;if(v){x=v.x;y=v.y+headTop(v.c,v.hat)-34}
    const pop=e.t<.15?e.t/.15*1.15:e.t<.25?1.15-(e.t-.15):1,fade=e.t>1.1?Math.max(0,1-(e.t-1.1)/.3):1,w=48*pop,h=57*pop;
    g.globalAlpha=fade;if(e.k.startsWith('card')){g.save();g.translate(x,y-h/2);g.rotate(Math.sin(e.t*5)*.15);g.fillStyle='rgba(0,0,0,.25)';rr(g,-w*.35+4,-h*.5+4,w*.7,h,6);g.fill();g.fillStyle=e.k==='cardY'?'#ffd21f':'#e8231c';rr(g,-w*.35,-h*.5,w*.7,h,6);g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke();g.restore()}else g.drawImage(FXI['e_'+e.k],x-w/2,y-h-Math.sin(e.t*6)*3,w,h)}
  g.globalAlpha=1;emos=emos.filter(e=>e.t<1.4)}
function vxy(id){const v=view[id];return v?[v.x,v.y]:null}

    const fl=[[200,300,'flower'],[230,330,'flower'],[180,345,'tuft'],[520,330,'fbush'],[980,330,'ybush'],[1300,450,'flower'],[1330,430,'flower'],[160,620,'fbush'],[520,700,'flower'],[545,725,'tuft'],[980,720,'fbush'],[1300,620,'tuft'],[1000,420,'flower'],[480,430,'tuft'],[600,820,'ybush'],[900,830,'flower'],[1250,820,'flower'],[260,840,'tuft']];

  else if(LOC==='soccer'){const L=40,Tt=TOP+14,B=AH-34;for(const [x,y] of [[L,Tt],[L,B],[GX,Tt],[GX,B]])f.drawImage(D.s_flag,x-6,y-52,64,54)}

    if(fu>0){const h=40+k*90;for(const [c,w,hh] of [['#ff6a1a',38,h],['#ffb02e',26,h*.7],['#fff3a0',12,h*.4]]){g.fillStyle=c;g.beginPath();g.moveTo(NF.x-w,NF.y);g.quadraticCurveTo(NF.x-w*.6+fl,NF.y-hh*.6,NF.x+fl*.5,NF.y-hh);g.quadraticCurveTo(NF.x+w*.6-fl,NF.y-hh*.6,NF.x+w,NF.y);g.closePath();g.fill()}}},
  drawPlayer(g,v,t){drawHero(g,v,t+v.x*.01);if(v.bag){g.save();g.translate(v.x+(v.face||1)*30,v.y-66);g.rotate(-.4);rr(g,-24,-8,48,16,7);sh(g,'#8a5a32',2.5);g.restore()}},
  over(g,t){if(!gmV)return;const night=gmV.ph===1,fu=gmV.f;if(night||gmV.tl<3&&gmV.ph===0){const a=night?Math.min(.9,.55+gmV.n*.12):(3-gmV.tl)/3*.5;const L=[[NF.x,NF.y-40,150+fu*2.6]];for(const id in view){const v=view[id];L.push([v.x,v.y-60,v.id===me.id?170:120])}drawDark(g,a,L)}
    const bw=260,x0=NF.x-bw/2,y0=NF.y+70;g.fillStyle='#000a';g.fillRect(x0-3,y0-3,bw+6,16);g.fillStyle=fu>50?'#ffb02e':fu>25?'#ff7a1a':'#e8412c';g.fillRect(x0,y0,bw*fu/100,10)},
  ev(e){if(e[0]==='NN'){pops.push({x:NF.x,y:NF.y-230,t:-.05,txt:T('nfNight')(e[1]),big:1});tone(160,.8,'sine',.12,80);return true}
    if(e[0]==='ND'){pops.push({x:NF.x,y:NF.y-230,t:-.05,txt:T('nfDay')(e[1]),big:1});[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle',.08),i*120));return true}
    if(e[0]==='NB'){emote(e[1],'alert');pops.push({x:e[2],y:e[3]-120,t:-.05,txt:T('nfBite'),big:1});tone(220,.3,'sawtooth',.12,90);if(e[1]===me.id){vib([150,60,150]);screenFx('siren',500)}return true}
    if(e[0]==='NS'){burst(e[2],e[3]-40,'puff',8,1);pops.push({x:e[2],y:e[3]-90,t:0,txt:T('nfScared')});if(!sfx('kick',.6))tone(500,.1,'square',.12);return true}
    if(e[0]==='NF'){burst(NF.x,NF.y-30,'puff',8,1);pops.push({x:NF.x,y:NF.y-120,t:-.05,txt:T('nfFire'),big:1});tone(120,.4,'sawtooth',.1,60);return true}
    if(e[0]==='NW'){burst(e[2],e[3]-60,'star',8,.9);pops.push({x:e[2],y:e[3]-110,t:0,txt:'🔥+1'});if(e[1]===me.id){sfx('pick',.6);vib(30)}return true}
    if(e[0]==='NL'){if(e[1]===me.id)sfx('pick',.4);return true}
    if(e[0]==='MG'){burst(e[1],e[2]-30,'puff',5,.7);return true}
    if(e[0]==='NO'){pops.push({x:NF.x,y:NF.y-200,t:-.05,txt:'🔥💨',big:1});return true}return false},
  hud(){if(!gmV)return '';return `<span>${gmV.ph?'🌙':'☀️'} ${T('nfLbl')(gmV.n,NF_N)} · ${Math.ceil(gmV.tl)}s</span>`},
  state(){return {f:Math.round(G.fuel),ph:G.ph,n:G.n,tl:+G.pt.toFixed(1)}},apply(x){gmV=x}};

/*GMS-END*/setLoc(FIXED);
home();
})();
</script>
