function lerpTo(o,dt){if(o.tx==null)return;o.tx+=(o.vx||0)*dt;o.ty+=(o.vy||0)*dt;const k=Math.min(1,dt*12);o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k}
function applySnap(m){
 if(m.si!==stageIdx||!ground){buildStage(m.si);stageIdx=m.si;mines=[];fx=[];parts=[];texts=[];enemies=[];boss=null;players.forEach(p=>p.tx=null)}

 const byI=new Map(players.map(p=>[p.i,p]));

  Object.assign(p,{hero:s.h,name:s.n||p.name,hp:s.hp,max:s.mx,energy:s.e,down:!!s.d,revive:s.rv,anim:s.an,animMax:s.am,combo:s.c,charge:s.ch,clvl:s.cl,inv:s.iv,flash:s.fl,pw:s.pw||null,pwT:s.pt,shield:s.sd,kills:s.k,dmg:s.dm});
  p.dash=s.ds?{t:0.1,a:s.f,hit:new Set()}:null;
  if(s.i===NET.slot){if(fresh||p.down||s.ds||Math.hypot(p.x-s.x,p.y-s.y)>220){p.x=s.x;p.y=s.y;p.vx=p.vy=0}if(p.down||s.ds)p.face=s.f}
  else{p.face=s.f;p.moving=!!s.mv;p.vx=s.vx;p.vy=s.vy;p.tx=s.x;p.ty=s.y;if(fresh||Math.hypot(p.x-s.x,p.y-s.y)>300){p.x=s.x;p.y=s.y}}
  return p});np=players.length;
 const oldE=new Map(enemies.map(e=>[e.id,e]));
 enemies=m.E.map(s=>{let e=oldE.get(s.id);const fresh=!e;if(!e)e={id:s.id,t:Math.random()*5,ex:s.x,ey:s.y,dead:false};
  Object.assign(e,{type:s.ty,r:s.r,hp:s.hp,max:s.mx,spawn:s.sp,flash:s.fl,stun:s.sn,st:s.st,dir:s.dr,dashA:s.da,cd:s.cd,phase:s.ph,vx:s.vx,vy:s.vy,tx:s.x,ty:s.y});
  if(fresh||Math.hypot(e.x-s.x,e.y-s.y)>250){e.x=s.x;e.y=s.y}return e});
 if(m.B){const s=m.B,fresh=!boss;if(!boss)boss={isBoss:true,t:0,ex:s.x,ey:s.y};Object.assign(boss,{r:s.r,hp:s.hp,max:s.mx,spawn:s.sp,flash:s.fl,stun:s.sn,enraged:!!s.en,pat:s.pat||null,sub:s.sub,dir:s.dr,name:s.n,col:s.c,col2:s.c2,vx:s.vx,vy:s.vy,tx:s.x,ty:s.y});if(fresh||Math.hypot(boss.x-s.x,boss.y-s.y)>300){boss.x=s.x;boss.y=s.y}}else boss=null;
 bullets=m.b.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3],r:a[4],col:a[5]}));
 pshots=m.s.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3],r:a[4],col:a[5],pierce:a[6]?false:undefined}));
 pickups=m.k.map(a=>({kind:a[0],x:a[1],y:a[2],t:a[3],bob:a[4]}));
 const oldM=mines;mines=m.m.map((a,i)=>({x:a[0],y:a[1],arm:a[2],fuse:a[3],t:oldM[i]?oldM[i].t:0}));

 for(const e of m.ev||[]){const k=e[0];if(k==='b')burst(e[1],e[2],e[3],e[4],e[5]);else if(k==='s')sparks(e[1],e[2],e[3],e[4],e[5]);else if(k==='t')text(e[1],e[2],e[3],e[4],e[5]);else if(k==='a')sfx(e[1],e[2]);else if(k==='f')fx.push(e[1])}
}
function guestUpdate(dt){
 runTime+=dt;
 for(const p of players){p.t+=dt;p.anim=Math.max(0,p.anim-dt);p.inv=Math.max(0,p.inv-dt);p.flash=Math.max(0,p.flash-dt);
  if(p.i===NET.slot){if(state==='play'&&!p.down&&!p.dash){const I=IN[0],Hh=HEROES[p.hero];const spd=Hh.spd*(p.charge>=0?0.45:1)*(p.hero===0&&p.hp<p.max*0.35?1.15:1);
    p.moving=Math.hypot(I.mx,I.my)>0.15;if(p.moving&&p.anim<=0)p.face=Math.atan2(I.my,I.mx);const k=Math.min(1,dt*14);p.vx=lerp(p.vx,I.mx*spd,k);p.vy=lerp(p.vy,I.my*spd,k);physics(p,dt);
    const hw=W/2/ZMIN-50,hh=H/2/ZMIN-60;p.x=clamp(p.x,cam.x-hw,cam.x+hw);p.y=clamp(p.y,cam.y-hh,cam.y+hh)}else p.moving=false}
  else lerpTo(p,dt)}
 for(const e of enemies){e.t+=dt;e.flash=Math.max(0,e.flash-dt);if(e.spawn>0)e.spawn-=dt;lerpTo(e,dt)}
 if(boss){boss.t+=dt;boss.flash=Math.max(0,boss.flash-dt);if(boss.spawn>0)boss.spawn-=dt;lerpTo(boss,dt)}
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}
 for(const q of pshots){q.x+=q.vx*dt;q.y+=q.vy*dt;if(Math.random()<0.5)part(q.x,q.y,rand(-30,30),rand(-30,30),0.25,3,q.col)}
 for(const k of pickups)k.t+=dt;for(const q of mines){q.t+=dt;if(q.arm>0)q.arm-=dt}
 if(portal){portal.t+=dt;if(Math.random()<0.9){const a=rand(0,TAU);part(portal.x+Math.cos(a)*120,portal.y+Math.sin(a)*55,-Math.cos(a)*140,-Math.sin(a)*70-40,0.8,3,Math.random()<0.5?S.accent:'#ffffff',{drag:0.5})}}
 NET.sendT-=dt;const I=IN[0],key=(I.atk?1:0)+(I.sp?2:0);
 if(NET.sendT<=0||key!==NET.lastKey){NET.sendT=0.05;NET.lastKey=key;const me=players.find(p=>p.i===NET.slot);nsend({t:'in',mx:r2(I.mx),my:r2(I.my),a:I.atk?1:0,s:I.sp?1:0,x:me?r1(me.x):null,y:me?r1(me.y):null})}
 if(players.length)updateCamera(dt);
}
function netTick(dt){

 if(NET.guest){const now=performance.now();
  if(!NET.joined&&state==='lobby'&&now-NET.joinT>12000){netLeave();showMsg('Комната не найдена. Проверь код.')}

}
