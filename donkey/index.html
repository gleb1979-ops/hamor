<style>
:root{--bg:#14101f;--panel:#221a35;--fg:#f6f1ff;--muted:#a99cc4;--hot:#ff3d7f;--sun:#ffc93c;--line:#3a2e55;--ok:#25d366;--brown:#9a6232;
  --display:"Unbounded","Rubik","Arial Black",system-ui,sans-serif;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#app{position:relative;height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;text-align:center;padding-block:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,48px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:clamp(18px,5vw,24px);margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);max-width:34ch;line-height:1.45}
.big{font-size:72px;line-height:1}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:17px;background:var(--hot);color:#fff;box-shadow:0 6px 0 #a3194b;text-decoration:none;display:inline-block}
button:active{transform:translateY(3px);box-shadow:0 3px 0 #a3194b}
button:disabled{opacity:.4}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.ghost{background:transparent;color:var(--fg);box-shadow:none;border:2px solid var(--line)}
.wa{background:var(--ok);color:#0b2a17;box-shadow:0 6px 0 #128c4a}
input{font:inherit;padding:13px 18px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--fg);width:min(100%,320px);text-align:center}
.col{display:grid;gap:10px;width:min(100%,320px)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.code{font-family:var(--display);font-size:40px;letter-spacing:.2em;color:var(--sun)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:min(100%,380px)}
.list li{display:flex;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-variant-numeric:tabular-nums}
.list li.me{border-color:var(--sun)}
.list li.loser{border-color:var(--hot);background:#ff3d7f22;font-weight:700}
.hud{position:absolute;top:12px;left:0;right:0;z-index:5;pointer-events:none;display:grid;gap:6px;justify-items:center}
#pad{position:fixed;inset:0;z-index:4}
.tgt{position:absolute;touch-action:none;will-change:left,top,transform;width:88px;height:88px;padding:0;font-size:54px;line-height:88px;background:var(--sun);box-shadow:0 6px 0 #b8860b;animation:none}
@keyframes pop{from{transform:scale(.2)}}
.status{font-size:13px;color:var(--muted)}
.err{color:var(--hot)}
.word{font-family:"Rubik",sans-serif;font-weight:700;font-size:20px;letter-spacing:2px;white-space:nowrap}.word i{font-style:normal;opacity:.18}.word b{color:var(--hot)}
.donkey{display:block;overflow:visible}
.list .donkey{display:inline-block;vertical-align:middle}
.dk-wrap{position:relative;display:grid;place-items:center}
.bray{animation:bray .75s ease-in-out 4}
@keyframes bray{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.06)}45%{transform:rotate(6deg)}70%{transform:rotate(-4deg) scale(1.04)}}
.hh{position:absolute;font-family:var(--display);font-weight:800;font-size:clamp(20px,6vw,30px);color:var(--sun);text-shadow:0 3px 0 var(--hot);opacity:0;animation:hh .75s ease-out both;white-space:nowrap}
@keyframes hh{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{opacity:0;transform:translateY(-40px) scale(1)}}
@media (prefers-reduced-motion:reduce){.bray,.hh{animation-duration:.01s}}
.modes{display:grid;gap:10px;width:min(100%,340px)}
.lang{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:max(12px,env(safe-area-inset-right,0px));z-index:60;padding:8px 14px;font-size:14px;background:var(--panel);box-shadow:none;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.tgt{animation:none}}
.homeb[hidden]{display:none!important}
.homeb{position:fixed;top:max(10px,env(safe-area-inset-top,0px));inset-inline-start:max(12px,env(safe-area-inset-left,0px));z-index:60;display:grid;place-items:center;width:42px;height:42px;border-radius:14px;font-size:22px;text-decoration:none;background:#000a;border:1px solid #ffffff40;-webkit-tap-highlight-color:transparent}
.gsw{margin-top:16px;width:min(100%,560px);display:grid;gap:8px;justify-items:center}.gsl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.gsb{padding:9px 14px!important;font-size:14px!important}.gsb.on{background:#ffc531!important;color:#2b1b30!important;border-color:#ffc531!important}
</style>

function step(){const now=performance.now();ctx.clearRect(0,0,W,H);for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a+=p.r;
  if(p.ty!=null){if(p.y>=p.ty){p.y=p.ty;p.vy=p.vx=p.r=p.g=0;if(now>p.until)p.life-=.035}}
  else if(p.y>H-p.sz/2&&p.vy>0){p.y=H-p.sz/2;if(p.pile){p.vy=0;p.vx=0;p.r=0;p.life-=.004}else{p.vy*=-.45;p.vx*=.7;p.life-=.18}}
  ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.drawImage(sprite(p.e),-p.sz/2,-p.sz/2,p.sz,p.sz);ctx.restore()}
  parts=parts.filter(p=>p.life>0&&p.y<H+200);if(parts.length)requestAnimationFrame(step);else{running=false;ctx.clearRect(0,0,W,H)}}

  tier(10,62,76,26,'#6b3f1d');tier(13,60,70,22,'#8a5528');

  g.fillStyle='#a06a34';g.beginPath();g.ellipse(50,18,9,8,-.5,0,7);g.fill();
  g.fillStyle='#ffffff55';g.beginPath();g.ellipse(36,66,8,3.5,0,0,7);g.fill();g.beginPath();g.ellipse(41,45,6,2.8,0,0,7);g.fill();g.beginPath();g.ellipse(44,27,4,2,0,0,7);g.fill()}

  g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.16)}catch(e){}}

let client,room,isHost=false,players=new Map(),results={},round=0,phase='lobby',hostTimer;
function topic(){return NS+room}
let SOLO=false;function send(m){m.from=me.id;if(SOLO){const c=JSON.parse(JSON.stringify(m));setTimeout(()=>onMsg(c),0);return}client&&client.publish(topic(),JSON.stringify(m),{qos:1})}
function soloStart(){SOLO=true;isHost=true;room='BOTS';players=new Map([[me.id,{name:me.name,host:true}]]);T('botN').forEach((n,i)=>players.set('bot'+i,{name:n,bot:1}));broadcastLobby()}
function botsPlay(m){for(const [id,p] of players){if(!p.bot)continue;const r=Math.random();const ms=r<.07?1500:r<.11?3000:Math.round(260+Math.random()*Math.random()*520);
 setTimeout(()=>{if(round!==m.round)return;(results[m.round]=results[m.round]||{})[id]=ms;checkRound()},(ms>=1500?(ms===1500?m.delay*.6:m.delay+3000):m.delay+ms))}}
function connect(code,cb){room=code;
  if(!window.roomClient&&!window.mqtt){fail(T('errLib'));return}
  client=window.roomClient?roomClient(topic(),BROKER,{clientId:'hamor_'+me.id,clean:true,reconnectPeriod:2000,connectTimeout:8000}):mqtt.connect(BROKER,{clientId:'hamor_'+me.id,clean:true,reconnectPeriod:2000,connectTimeout:8000});
  let first=true;
  client.on('connect',()=>{client.subscribe(topic(),{qos:1},()=>{if(first){first=false;cb()}else hello()})});
  client.on('message',(t,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}onMsg(m)});
  client.on('error',()=>{});
  setTimeout(()=>{if(first)fail(T('errConn'))},10000)}
function fail(t){redraw=()=>fail(t);app.innerHTML=`<div class="big">😵</div><h2>${esc(t)}</h2><button onclick="location.reload()">${T('reload')}</button>`}
function hello(){send({t:'hi',name:me.name,host:isHost})}

function onMsg(m){if(followGoto(m))return;if(m.t==='lobby'&&m.players&&m.players.some(p=>p.id===me.id))seenMe=true;
  if(['lobby','round','rres','end','hb','st','start','kb'].includes(m.t))markHost(m);
  if(m.t==='bye'&&!isHost&&hostId&&m.from===hostId&&phase!=='end'){hostGone();return}
  if(m.t==='hi'){if(!players.has(m.from)||players.get(m.from).name!==m.name){players.set(m.from,{name:m.name,host:!!m.host})}
    if(isHost)broadcastLobby();else if(phase==='lobby')lobby()}
  else if(m.t==='lobby'&&!isHost){players=new Map(m.players.map(p=>[p.id,{name:p.name,host:p.host}]));if(phase==='lobby')lobby()}
  else if(m.t==='round'){phase='play';playRound(m)}
  else if(m.t==='res'&&isHost){(results[m.round]=results[m.round]||{})[m.from]=m.ms;checkRound()}
  else if(m.t==='srr'){if(onMsg.sk===m.round+'|'+JSON.stringify(m.ms))return;onMsg.sk=m.round+'|'+JSON.stringify(m.ms);shortResult(m)}
  else if(m.t==='rres'){const k=JSON.stringify([m.round,m.losers,m.ms]);if(onMsg.rk===k)return;onMsg.rk=k;roundResult(m)}
  else if(m.t==='end'){if(phase==='end')return;phase='end';final({rows:m.board,mode:m.mode})}
  else if(m.t==='bye'){players.delete(m.from);if(isHost)broadcastLobby()}}
function broadcastLobby(){send({t:'lobby',players:[...players].map(([id,p])=>({id,name:p.name,host:p.host}))});if(phase==='lobby')lobby()}

let total={},letters={},mode='short',closed=0;
function startGame(md){mode=md||mode;results={};total={};letters={};round=0;closed=0;for(const id of players.keys())letters[id]=0;nextRound()}
function nextRound(){round++;if(mode==='short'&&round>ROUNDS)return endGame();if(round>40)return endGame();
  const rm={t:'round',round,mode,letters,delay:1200+Math.random()*2200,x:Math.random(),y:Math.random(),a:Math.random()*6.283};send(rm);if(SOLO)botsPlay(rm);
  clearTimeout(hostTimer);hostTimer=setTimeout(closeRound,8000)}
function checkRound(){const r=results[round]||{};if([...players.keys()].every(id=>id in r)){clearTimeout(hostTimer);setTimeout(closeRound,600)}}
function closeRound(){if(closed===round)return;closed=round;const r=results[round]||{},ms={};
  for(const id of players.keys()){ms[id]=id in r?r[id]:3000;total[id]=(total[id]||0)+ms[id];if(!(id in letters))letters[id]=0}
  if(mode==='short'){const sm={t:'srr',round,ms,names:Object.fromEntries([...players].map(([id,p])=>[id,p.name]))};send(sm);[700,1600].forEach(d=>setTimeout(()=>{if(round===sm.round)send(sm)},d));setTimeout(nextRound,4200);return}
  const worst=Math.max(...Object.values(ms)),losers=Object.keys(ms).filter(id=>ms[id]===worst);
  losers.forEach(id=>letters[id]=Math.min(4,letters[id]+1));
  const over=losers.some(id=>letters[id]>=4);
  const rm={t:'rres',round,losers,ms,letters,names:Object.fromEntries([...players].map(([id,p])=>[id,p.name]))};send(rm);[900,2000].forEach(d=>setTimeout(()=>{if(closed===rm.round&&round===rm.round)send(rm)},d));
  setTimeout(over?endGame:nextRound,over?3500:4000)}
function endGame(){const board=[...players].map(([id,p])=>({id,name:p.name,ms:Math.round(total[id]/Math.max(1,round-(mode==='short'?1:0))),l:letters[id]||0}));
  if(mode==='long')board.sort((a,b)=>a.l-b.l||a.ms-b.ms);else board.sort((a,b)=>a.ms-b.ms);
  send({t:'end',board,mode});[900,2200].forEach(d=>setTimeout(()=>{if(phase==='end')send({t:'end',board,mode})},d))}

/* every player */
function playRound(m){redraw=()=>{};lb.hidden=true;hb.hidden=true;const my=m.mode==='long'?(m.letters[me.id]||0):-1;
  app.innerHTML=`<div class="hud"><h2>${T('round')} ${m.round}${m.mode==='long'?'':'/'+ROUNDS}</h2>${my>=0?donkey(my,56)+word(my):''}<p id="hm">${T('waitCarrot')}</p></div><div id="pad"></div>`;
  const pad=document.getElementById('pad'),hm=document.getElementById('hm');let state='wait',t0,done=false;
  const report=ms=>{if(done)return;done=true;send({t:'res',round:m.round,ms})};
  pad.addEventListener('pointerdown',()=>{if(state!=='wait')return;state='x';clearTimeout(tm);hm.innerHTML=`<span class="err">${T('early')}</span>`;sfx('err',.5);try{navigator.vibrate(150)}catch(e){};report(1500)});
  const tm=setTimeout(()=>{if(state!=='wait')return;state='go';const t=document.createElement('button');t.className='tgt';t.textContent='🥕';t.setAttribute('aria-label',T('carrot'));
    let px=10+m.x*(W-150),py=130+m.y*Math.max(40,H-300);const sp=Math.min(W,H)*.42,ang=m.a??Math.random()*6.28;let vx=Math.cos(ang)*sp,vy=Math.sin(ang)*sp,last=performance.now();
    const place=()=>{t.style.left=px+'px';t.style.top=py+'px'};place();pad.appendChild(t);t0=performance.now();
    (function mv(now){if(state!=='go')return;const dt=Math.min(.05,(now-last)/1000);last=now;px+=vx*dt;py+=vy*dt;
      if(px<8){px=8;vx=Math.abs(vx)}if(px>W-96){px=W-96;vx=-Math.abs(vx)}if(py<120){py=120;vy=Math.abs(vy)}if(py>H-100){py=H-100;vy=-Math.abs(vy)}
      t.style.transform=`rotate(${Math.sin(now/180)*14}deg)`;place();requestAnimationFrame(mv)})(last);
    t.addEventListener('pointerdown',e=>{e.stopPropagation();if(state!=='go')return;state='x';const dt=Math.round(performance.now()-t0);blip(500+Math.max(0,900-dt));sfx('pick',.45);
      const b=t.getBoundingClientRect();burst(b.left+44,b.top+44,['🥕','✨'],12,.5);t.remove();hm.textContent=`${dt} ${T('ms')} · ${T('waitOthers')}`;report(dt)});
    setTimeout(()=>{if(state==='go'){state='x';t.remove();hm.textContent=T('slept');report(3000)}},3000)},m.delay)}

function shortResult(m,again){redraw=()=>shortResult(m,1);lb.hidden=false;hb.hidden=false;const ids=Object.keys(m.ms).sort((a,b)=>m.ms[a]-m.ms[b]);const worst=m.ms[ids[ids.length-1]];
  const place=ids.indexOf(me.id),pm=[0,1,2].map(i=>mimg(i,26)),pmB=[0,1,2].map(i=>mimg(i,84));if(!again){const lo=m.ms[me.id]===worst&&ids.length>1;if(!sfx(lo?'lose':'medal',.6))blip(lo?300:700)}
  app.innerHTML=`<div class="big">${place>=0&&place<3?pmB[place]:'🫏'}</div><h1 style="font-size:clamp(24px,7vw,38px)">${T('rres')(m.round)}</h1>
    <ol class="list">${ids.map((id,k)=>`<li class="${m.ms[id]===worst&&ids.length>1?'loser':id===me.id?'me':''}"><span>${k<3?pm[k]:k+1+'.'} ${esc(m.names[id]||'?')}${id===me.id?' '+T('you'):''}</span><span>${m.ms[id]} ${T('ms')} ${rank(m.ms[id])}</span></li>`).join('')}</ol>
    <p class="status">${m.round<ROUNDS?T('next'):'🏁'}</p>`}
function roundResult(m){redraw=()=>roundResult(m,1);lb.hidden=false;hb.hidden=false;const mine=m.losers.includes(me.id);
  const names=m.losers.map(id=>m.names[id]||'?');const L1=WORDS[lang][(m.letters[m.losers[0]]||1)-1];
  const again=arguments[1];if(!again){sfx(mine?'lose':'medal',.6);if(mine){blip(300);try{navigator.vibrate&&navigator.vibrate([150,60,150])}catch(e){}}else blip(700)}
  const myN=m.letters[me.id]||0,myFrom=again?myN:(mine?myN-1:myN);
  const rows=Object.keys(m.letters).sort((a,b)=>m.letters[a]-m.letters[b]||(m.ms[a]-m.ms[b])).map(id=>
    `<li class="${m.losers.includes(id)?'loser':id===me.id?'me':''}"><span>${esc(m.names[id]||'?')}</span><span>${m.ms[id]} ${T('ms')} &nbsp;${donkey(m.letters[id],30,again?m.letters[id]:(m.losers.includes(id)?m.letters[id]-1:m.letters[id]))}</span></li>`).join('');
  app.innerHTML=`<div class="dk-wrap">${donkey(myN,mine?150:110,myFrom)}</div>${word(myN)}<h1 style="font-size:clamp(24px,7vw,38px)">${mine?T('youGot')(L1):esc(names.join(', '))+' · '+L1}</h1>
    ${mine?'':`<p>${esc(T('gotLetter')(names.join(', '),L1))}</p>`}<ol class="list">${rows}</ol><p class="status">${T('next')}</p>`;fillDonkeys()}

function final(board,again){const mode=arguments[2]||board.mode||'short';board=board.rows||board;lb.hidden=false;hb.hidden=false;redraw=()=>final({rows:board,mode},1);
  const last=board[board.length-1];const iAm=last&&last.id===me.id;if(!again){boom();bray(4,iAm);if(board[0]&&board[0].id===me.id&&!iAm)setTimeout(()=>sfx('win',.6),400);rain(['🫏'],iAm?140:70);setTimeout(()=>burst(W/2,H*.4,['🫏','😂','🥕'],100,1.2),300)}
  const hh=again?'':[0,1,2,3].map(i=>`<span class="hh" style="animation-delay:${i*.75}s;top:${-8-i%2*18}px;${i%2?'left':'right'}:${-10+i*4}px">${T('heehaw')}</span>`).join('');
  const txt=(mode==='long'?T('lettersShare')(last.name):T('shareText')(last.name,last.ms))+' '+baseLink();
  app.innerHTML=`<div class="dk-wrap">${hh}${donkey(4,170,again?4:(mode==='long'?3:0),again?'':'bray')}</div><h1>${iAm?T('youHamor'):esc(last.name)+T('isHamor')}</h1>
    <ol class="list">${board.map((r,k)=>`<li class="${k===board.length-1?'loser':r.id===me.id?'me':''}"><span>${k<3&&board.length>1&&k<board.length-1?mimg(k,26):k+1+'.'} ${esc(r.name)}</span><span>${mode==='long'?donkey(r.l,30)+' '+word(r.l):r.ms+' '+T('ms')+' '+rank(r.ms)}</span></li>`).join('')}</ol>
    <div class="row"><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${T('share')}</a>
    ${isHost?`<button class="ghost" id="rv">${T('rematch')}</button>`:''}</div>${isHost&&!SOLO?picker('donkey'):''}${isHost?'':`<p class="status">${T('rematchHost')}</p><button class="ghost" id="own2">${T('createOwn')}</button>`}`;
  fillDonkeys();if(!again)setTimeout(poopShow,500);if(isHost)bindPicker(g=>{if(g!=='donkey')goGame(g)});const o2=document.getElementById('own2');if(o2)o2.onclick=createOwn;
  if(isHost)document.getElementById('rv').onclick=()=>{phase='play';startGame(mode)}}

/* ---------- room watch: host gone / create own room ---------- */
let hostId=null,lastHost=0,watchT=null,autoCreated=false;
function markHost(m){if(!isHost&&m.from!==me.id){hostId=m.from;lastHost=performance.now()}}
function startWatch(){clearInterval(watchT);lastHost=performance.now();watchT=setInterval(()=>{if(isHost||phase==='end'||phase==='gone')return;if(performance.now()-lastHost>9000)hostGone()},1500)}
function baseLink(){return location.origin+location.pathname+'?lang='+lang}
function createOwn(){location.href=location.pathname+'?lang='+lang+'&create=1'}
function hostGone(){clearInterval(watchT);try{client&&client.end(true)}catch(e){}client=null;phase='gone';redraw=hostGone;lb.hidden=false;hb.hidden=false;
  app.innerHTML=`<div style="font-size:64px;line-height:1">👋</div><h2>${T(hostId?'hostGone':'noRoom')}</h2><p>${T('ownHint')}</p><button id="own">${T('createOwn')}</button>`;
  document.getElementById('own').onclick=createOwn}
setInterval(()=>{if(isHost&&client)send({t:'hb'})},3000);

home();
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));addEventListener('contextmenu',e=>{if(!e.target.closest('a,input,textarea'))e.preventDefault()});
</script>
