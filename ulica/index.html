const UPS={hp:{name:'Здоровье',desc:'+8%'},pow:{name:'Удар',desc:'+6%'},spd:{name:'Скорость',desc:'+4%'}},UPMAX=5;

const RANKS=['Новичок','Свой','Боец','Уличный','Авторитет','Легенда'];
function rankOf(lv){return RANKS[Math.min(5,(lv-1)>>1)]}
function xpNeed(lv){return 80+lv*60}
function saveProg(){LS.set('prog',PROG)}
function applyProg(f){const P=PROG.h[f.hero];f.mPow=1+P.up.pow*.06;f.mSpd=1+P.up.spd*.04;f.hp=f.max=Math.round(HEROES[f.hero].hp*(1+P.up.hp*.08))+(P.lv-1)*2}

 <div class="row">${Object.entries(UPS).map(([u,d])=>`<button class="up" data-u="${u}" ${P.pts>0&&P.up[u]<UPMAX?'':'disabled'}>${d.name} ${P.up[u]}/${UPMAX} <small>${d.desc}</small> ＋</button>`).join('')}</div>

function buildTrack(){if(RMAP===1)return buildOval();const P=RCP,n=P.length,xs=[],ys=[],sec=[];
 for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n],st=Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/10);
  for(let k=0;k<st;k++){const t=k/st,t2=t*t,t3=t2*t,f=(a,b,c,d)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);xs.push(f(p0[0],p1[0],p2[0],p3[0]));ys.push(f(p0[1],p1[1],p2[1],p3[1]));sec.push(RSECI[i])}}

 const xs=pts.map(p=>p[0]*RK),ys=pts.map(p=>p[1]*RK),N=xs.length,a=[],sec=[];for(let i=0;i<N;i++){const j=(i+1)%N;a.push(Math.atan2(ys[j]-ys[i],xs[j]-xs[i]));const px=pts[i][0],py=pts[i][1];sec.push(py>B-60?0:px>R-60?1:py<T0+60?2:3)}TR={x:xs,y:ys,a,sec,N}}

  G.hzT-=dt;if(G.hzT<=0&&G.t<BIKE_T-3){G.hzT=rnd(.9,1.7);const y=rnd(FLOOR0+70,FLOOR1-30),r=Math.random();if(r<.35)G.HL.push({x:W+60,y,r:28});else if(r<.65)G.BX.push({x:W+40,y:y-14,w:44,h:28,k:'barrel'});else if(r<.75&&!G.BX.some(o=>o.k==='car'&&o.x>W-400))G.BX.push({x:W+40,y:y-20,w:150,h:46,k:'car'});else G.RM.push({x:W+40,y:y-40,w:110,h:56})}
  const near=alive().sort((a,b)=>a.x-b.x)[0];if(near)G.copY+=(near.y-G.copY)*Math.min(1,dt*2);
  for(const f of G.F)if(f.state!=='ko'&&f.x<120){f.state='ko';f.hp=0;f.onBoard=false;f.downT=0;SFX.ko();G.FX.push({x:Math.max(80,f.x),y:f.y-170,t:0,life:1.2,txt:'ПРИНЯЛИ!',c:'#4a8aff',big:1})}}

 // particles
 for(let i=G.FX.length-1;i>=0;i--){const p=G.FX[i];p.t+=dt;if(p.vx!=null){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;if(p.blood&&p.y>p.gnd){if(BLOOD){dctx.fillStyle=p.c;dctx.beginPath();dctx.ellipse(p.x,p.gnd,p.s*1.4,p.s*.6,0,0,TAU);dctx.fill()}p.t=p.life}}if(p.t>=p.life)G.FX.splice(i,1)}
 if(shake>0)shake=Math.max(0,shake-dt*30);
 // round end
 if(!G.over){const sides=new Set(alive().map(sideOf));const OB=OBJM(),meDead=me.state==='ko'&&(mode==='ffa'||OB);
  const fin=mode==='bike'&&G.t>=BIKE_T;if((sides.size<=1&&!OB)||meDead||fin||(OB&&G.obj)){G.over=1;G.overT=0;let winSide=sides.size===1?[...sides][0]:null;if(fin&&sides.size>1){const lead=alive().sort((a,b)=>b.x-a.x)[0];winSide=sideOf(lead);G.FX.push({x:lead.x,y:lead.y-180,t:0,life:2,txt:'ПЕРВЫЙ!',c:'#e8b23a',big:1})}
   G.win=OB?(G.obj>0&&!meDead):(winSide!=null&&winSide===sideOf(me));gainXP(G.win?(OB?60:40):10);G.wins[G.win?'me':'them']=(G.wins[G.win?'me':'them']||0)+1;
   G.msg=OB?objMsg(G.win,meDead):G.win?'УЛИЦА ЗА ТОБОЙ':'ТЕБЯ ОТШИЛИ';G.sub='';G.msgT=99;SFX.bell()}}
 else{G.overT+=dt;if(G.overT>2.6)roundEnd()}}

function render(t){if(mode==='rayon')return rRender(t);ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
 ctx.drawImage(bg,0,0);ctx.drawImage(decal,0,0);

 items.sort((a,b)=>a.y-b.y).forEach(i=>i.d());
 for(const b of G.B){if(b.salt){circ(ctx,b.x,b.y,3.5,'#f4f4f0');continue}if(b.stone){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(G.t*14);drawWeapon(ctx,'stone',0,false);ctx.restore();continue}ctx.strokeStyle='#ffe28a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-Math.sign(b.vx)*30,b.y);ctx.stroke()}
 if(mode==='zavod')drawNight(t);if(OBJM())drawObjMarks(ctx,t);
 for(const p of G.FX){const k=p.t/p.life;if(p.txt){ctx.globalAlpha=1-k;ctx.font=`900 ${p.big?40:22}px Impact,'Arial Black',sans-serif`;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(p.txt,p.x,p.y-k*40);ctx.fillStyle=p.c;ctx.fillText(p.txt,p.x,p.y-k*40);ctx.globalAlpha=1}else{ctx.fillStyle=p.c;ctx.globalAlpha=1-k*.6;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();ctx.globalAlpha=1}}
 ctx.restore();
 // HUD
 const me=G.F[0];ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(16,14,300,58);ctx.font='900 20px Impact,sans-serif';ctx.textAlign='left';ctx.fillStyle='#f3e9dc';ctx.fillText(HH(me).name.toUpperCase()+(me.npc?'':' · УР. '+PROG.h[me.hero].lv),28,38);
 ctx.fillStyle='#331';ctx.fillRect(28,46,200,12);ctx.fillStyle=me.hp/me.max>.4?'#5ad05a':'#e0303a';ctx.fillRect(28,46,200*me.hp/me.max,12);
 ctx.font='bold 14px system-ui';ctx.fillStyle='#e8b23a';ctx.fillText(me.carry?'Ящик':me.weapon?(WEAPONS[me.weapon].name+(me.weapon==='pistol'?' ×'+me.ammo:'')):'Кулаки',236,57);
 if(mode==='skate'){for(let i=0;i<3;i++){ctx.globalAlpha=i<me.lives?1:.25;ctx.save();ctx.translate(46+i*58,90);drawBoard(ctx,{air:0},0);ctx.restore();ctx.globalAlpha=1}}
 if(mode==='bike'){const k=Math.min(1,G.t/BIKE_T);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W/2-200,18,400,22);ctx.fillStyle='#e8b23a';ctx.fillRect(W/2-196,22,392*k,14);ctx.fillStyle='#f3e9dc';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('до гаражей '+Math.max(0,Math.ceil(BIKE_T-G.t))+' с · не отставай — милиция!',W/2,58)}
 ctx.textAlign='right';ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W-216,14,200,40);ctx.fillStyle='#f3e9dc';ctx.font='900 20px Impact,sans-serif';ctx.fillText(`РАУНД ${G.round} · ${G.wins.me||0}:${G.wins.them||0}`,W-28,42);
 if(OBJM())drawObjHUD(t);
 if(G.msgT>0&&G.msg){ctx.textAlign='center';ctx.font='900 46px Impact,sans-serif';ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText(G.msg,W/2,120);ctx.fillStyle=G.over?(G.win?'#e8b23a':'#e0303a'):'#f3e9dc';ctx.fillText(G.msg,W/2,120);if(G.sub&&!G.over){ctx.font='bold 20px system-ui';ctx.lineWidth=5;ctx.strokeText(G.sub,W/2,158);ctx.fillStyle='#f3e9dc';ctx.fillText(G.sub,W/2,158)}}}

/* ---------- UI ---------- */
function heroCanvas(i){const c=document.createElement('canvas');c.width=140;c.height=190;const g=c.getContext('2d');drawFighter(g,{x:70,y:180,hero:i,face:1,state:'idle',anim:0,atkT:0,kickT:0,hp:1,max:1,name:'',bot:false,stun:0,weapon:i===2?'rebar':i===0?'bat':i===1?'chain':null,hurtT:0,flash:0,team:0,idx:0,noHud:1},0);
 g.clearRect(0,0,140,14);return c}
function showAge(){state='age';$ui.hidden=false;$ui.innerHTML=`<div class="card"><h1>УЛИЦА</h1><h2 style="color:#c8202a">КРОВЬ НА АСФАЛЬТЕ</h2><p class="sub">Уличные бои без правил. Конец восьмидесятых.</p>
 <div class="warn"><b>18+</b><br>В игре насилие, оружие и кровь. Все персонажи и события вымышлены.</div>
 <div class="row"><button class="pri" id="y18">Мне есть 18</button><button id="n18">Мне нет 18</button></div></div>`;
 document.getElementById('y18').onclick=()=>{au();LS.set('age',1);showMenu()};document.getElementById('n18').onclick=()=>{location.href='https://games.tagshim.com/'}}
function showMenu(){state='menu';document.getElementById('mb').hidden=true;document.getElementById('touch').hidden=true;$ui.hidden=false;$ui.innerHTML=`<div class="card"><h1>УЛИЦА</h1><h2 style="color:#c8202a">КРОВЬ НА АСФАЛЬТЕ</h2><p class="sub">Выбери пацана</p><div class="heroes" id="hs"></div><div id="pg">${progHTML()}</div>
 <div class="row"><button class="mb ${mode==='ffa'?'on':''}" data-m="ffa">Без правил · каждый сам</button><button class="mb ${mode==='team'?'on':''}" data-m="team">Стенка · 2 на 2</button><button class="mb ${mode==='rayon'?'on':''}" data-m="rayon">Район · гонка-драка 3 на 3</button><button class="mb ${mode==='zavod'?'on':''}" data-m="zavod">Завод · укради ящик</button><button class="mb ${mode==='salon'?'on':''}" data-m="salon">Видеосалон · отожми</button></div>
 ${mode==='rayon'?`<div class="row"><span style="align-self:center;opacity:.8">Транспорт:</span><button class="vh ${VEHSEL==='skate'?'on':''}" data-v="skate">🛹 Скейт — вёрткий</button><button class="vh ${VEHSEL==='bike'?'on':''}" data-v="bike">🚲 Велик — быстрый</button></div><div class="row"><span style="align-self:center;opacity:.8">Трасса:</span>${RMAPS.map((n,i)=>`<button class="rm ${RMAP===i?'on':''}" data-r="${i}">${n}</button>`).join('')}</div>`:''}<div class="row"><button id="bl" class="${BLOOD?'on':''}">Кровь: ${BLOOD?'вкл':'выкл'}</button><button class="pri" id="go">В БОЙ</button></div>
 <p class="sub" style="margin-top:14px;font-size:13px">Компьютер: WASD или стрелки · удар — F или левая кнопка мыши · пинок — G или правая кнопка. Оружие подбирается само. Завод: прячься от фонарей, бей со спины; с ящиком удар — бросить ящик. Видеосалон: стой в круге у телевизора. Район: держи направление стрелками/джойстиком — едешь туда.</p></div>`;
 const hs=document.getElementById('hs');HEROES.forEach((h,i)=>{const b=document.createElement('button');b.className='hb'+(i===myHero?' on':'');b.appendChild(heroCanvas(i));b.insertAdjacentHTML('beforeend',`<b>${h.name}</b><small>${h.desc}</small><small style="color:var(--gold)">ур. ${PROG.h[i].lv}${PROG.h[i].pts?' · очки: '+PROG.h[i].pts:''}</small>`);b.onclick=()=>{myHero=i;LS.set('hero',i);showMenu()};hs.appendChild(b)});
 $ui.querySelectorAll('.up').forEach(b=>b.onclick=()=>{const P=PROG.h[myHero],k=b.dataset.u;if(P.pts>0&&P.up[k]<UPMAX){P.pts--;P.up[k]++;saveProg();au();SFX.pick();showMenu()}});
 $ui.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{RMAP=+b.dataset.r;LS.set('rmap',RMAP);showMenu()});
 $ui.querySelectorAll('.vh').forEach(b=>b.onclick=()=>{VEHSEL=b.dataset.v;LS.set('veh',VEHSEL);showMenu()});
 $ui.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{mode=b.dataset.m;LS.set('mode',mode);G=null;LOC=0;paintBG();showMenu()});
 document.getElementById('bl').onclick=()=>{BLOOD=!BLOOD;LS.set('blood',BLOOD);showMenu()};
 document.getElementById('go').onclick=()=>{au();G=null;start()}}
function start(){try{getSelection().removeAllRanges()}catch(e){}$ui.hidden=true;state='play';MXP=0;MLV=0;document.getElementById('mb').hidden=false;newRound();document.getElementById('touch').hidden=!('ontouchstart' in window||navigator.maxTouchPoints>0)}
function roundEnd(){const w=G.wins;if((w.me||0)>=2||(w.them||0)>=2){state='end';document.getElementById('mb').hidden=true;const won=(w.me||0)>=2;if(won)gainXP(100);$ui.hidden=false;document.getElementById('touch').hidden=true;
  $ui.innerHTML=`<div class="card"><h1 style="text-shadow:4px 4px 0 ${won?'#e8b23a':'#c8202a'}">${endTitle(won)}</h1><p class="sub">Счёт ${w.me||0}:${w.them||0} · нокаутов: ${G.F[0].kills}</p>${progLine()}<div class="row"><button class="pri" id="again">Ещё раз</button><button id="menu">Меню</button></div></div>`;
  document.getElementById('again').onclick=()=>{G=null;start()};document.getElementById('menu').onclick=showMenu}
 else newRound()}

/* ---------- input ---------- */
addEventListener('keydown',e=>{keys[e.code]=true;if(state!=='play')return;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if((e.code==='KeyF'||e.code==='Space'||e.code==='KeyJ')&&!e.repeat)attack(G.F[0]);if((e.code==='KeyG'||e.code==='KeyK')&&!e.repeat)kick(G.F[0])});
addEventListener('keyup',e=>{keys[e.code]=false});
document.getElementById('mb').onclick=()=>{if(state==='play')showMenu()};addEventListener('keydown',e=>{if(e.code==='Escape'&&state==='play')showMenu()});
cv.addEventListener('mousedown',e=>{if(state!=='play')return;au();if(e.button===0)attack(G.F[0]);else if(e.button===2)kick(G.F[0])});

for(const ev of ['selectstart','dblclick','dragstart'])document.addEventListener(ev,e=>{if(state==='play'||e.target===cv)e.preventDefault()});
cv.addEventListener('mousedown',e=>e.preventDefault());cv.addEventListener('touchstart',e=>{if(state==='play')e.preventDefault()},{passive:false});
{const st=document.getElementById('stick'),kn=document.getElementById('knob');let id=null,cx=0,cy=0;
 st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);const r=st.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;mv(e)});
 const mv=e=>{if(e.pointerId!==id)return;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),m=60;if(d>m){dx=dx/d*m;dy=dy/d*m}kn.style.transform=`translate(${dx}px,${dy}px)`;pad.mx=Math.abs(dx)>12?dx/m:0;pad.my=Math.abs(dy)>12?dy/m:0};
 st.addEventListener('pointermove',mv);const up=e=>{if(e.pointerId!==id)return;id=null;pad.mx=pad.my=0;kn.style.transform=''};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 document.getElementById('bA').addEventListener('pointerdown',e=>{e.preventDefault();au();if(state==='play')attack(G.F[0])});
 document.getElementById('bB').addEventListener('pointerdown',e=>{e.preventDefault();au();if(state==='play')kick(G.F[0])})}

requestAnimationFrame(loop);

})();
