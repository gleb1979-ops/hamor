 blood(b.x,b.y-110,heavy?14:7,a.face);if(BLOOD&&Math.random()<.5)decalBlood(b.x+a.face*rnd(10,40),b.y+rnd(-6,8),rnd(5,14));

 if(heavy&&Math.random()<.45){b.state='down';b.downT=0;b.stun=1.1}
 if(b.hp<=0){b.hp=0;b.state='ko';b.downT=0;a.kills++;SFX.ko();decalBlood(b.x,b.y,30);G.FX.push({x:b.x,y:b.y-170,t:0,life:1.1,txt:'НОКАУТ',c:'#ffffff',big:1})}}
function attack(f){if(f.cd>0||f.stun>0||f.state==='down'||f.state==='ko')return;const w=f.weapon?WEAPONS[f.weapon]:(HEROES[f.hero].small?{...WEAPONS.fist,cd:.26}:WEAPONS.fist);

 if(w.throw){f.weapon=null;SFX.whoosh();G.B.push({x:f.x+f.face*30,y:f.y-100,vx:f.face*950,o:f,life:.8,yy:f.y,stone:1});return}

 SFX.whoosh();const T=hitBox(f,w);for(const b of T){damage(f,b,w.dmg+rnd(-2,3),w.knock,!!w.len&&Math.random()<.35);if(w.len||w.stab||f.weapon==='knux'){f.bloody=true;if(w.metal&&!w.stab)SFX.metal()}if(w.stab){blood(b.x,b.y-100,10,f.face);if(BLOOD)decalBlood(b.x,b.y+rnd(-4,6),rnd(8,16))}if(w.glass&&f.dur<=1)SFX.metal()}

function pickupNear(f){if(f.state==='ko'||f.state==='down')return;for(let i=G.P.length-1;i>=0;i--){const p=G.P[i];if(Math.hypot(p.x-f.x,(p.y-f.y)*1.6)<44){if(p.k==='kefir'){if(f.hp>=f.max)continue;f.hp=Math.min(f.max,f.hp+WEAPONS.kefir.heal);G.FX.push({x:f.x,y:f.y-160,t:0,life:.8,txt:'+35',c:'#7cf07c'});SFX.pick();G.P.splice(i,1);continue}

function botThink(f,dt){const A=f.ai;A.t-=dt;let mx=0,my=0;
 const enemies=alive().filter(b=>sideOf(b)!==sideOf(f));if(!enemies.length)return[0,0];
 if(A.t<=0||!A.tgt||A.tgt.state==='ko'){A.t=rnd(.6,1.4);A.tgt=enemies.sort((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y))[Math.random()<.75?0:Math.random()*enemies.length|0];A.wantPick=!f.weapon&&Math.random()<.6}
 let tx=A.tgt.x,ty=A.tgt.y;
 if(A.wantPick&&!f.weapon){const p=G.P.filter(p=>p.k!=='kefir').sort((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y))[0];if(p&&Math.hypot(p.x-f.x,p.y-f.y)<420){tx=p.x;ty=p.y}}
 if(f.hp<f.max*.35){const k=G.P.find(p=>p.k==='kefir');if(k){tx=k.x;ty=k.y}}
 const w=f.weapon?WEAPONS[f.weapon]:WEAPONS.fist;const isT=tx===A.tgt.x;
 const want=isT?(w.gun?380:w.range*.7):0;const dx=tx-f.x,dy=ty-f.y;
 if(isT){if(Math.abs(dx)>want+10)mx=Math.sign(dx);else if(Math.abs(dx)<want-30&&!w.gun)mx=-Math.sign(dx)*.4;if(Math.abs(dy)>12)my=Math.sign(dy)}
 else{const d=Math.hypot(dx,dy)||1;mx=dx/d;my=dy/d}
 if(isT){f.face=dx>=0?1:-1;if(Math.abs(dy)<26&&Math.abs(dx)<w.range+10&&Math.random()<dt*2.6)attack(f);if(Math.abs(dy)<26&&Math.abs(dx)<70&&Math.random()<dt*.5)kick(f)}
 if(mode==='bike'&&f.onBoard){if(f.x<360)mx=1;else if(f.x>1080)mx=-.5;for(const o of [...G.BX,...G.HL]){const ox=o.x+(o.w||0)/2,oy=o.y+(o.h||0)/2;if(ox>f.x&&ox-f.x<220&&Math.abs(oy-f.y)<46){my=oy>f.y?-1:1;break}}}
 return [mx,my]}

/* ---------- update ---------- */
function update(dt){G.t+=dt;if(G.msgT>0)G.msgT-=dt;
 const me=G.F[0];
 for(const f of G.F){f.cd-=dt;f.kcd-=dt;f.atkT-=dt;f.kickT-=dt;f.flash-=dt;f.anim+=dt;if(f.hurtT>0)f.hurtT-=dt;if(f.stun>0)f.stun-=dt;
  if(f.state==='ko'){f.downT+=dt;continue}
  if(f.state==='down'){f.downT+=dt;f.vx*=Math.pow(.02,dt);f.x+=f.vx*dt;if(mode==='bike'&&!G.over)f.x-=SCROLL*.55*dt;if(f.stun<=0){f.state='idle';f.downT=0;if(ride()&&f.lives>0)f.onBoard=true}continue}
  let mx=0,my=0;
  if(G.over){}
  else if(f.bot)[mx,my]=botThink(f,dt);
  else{mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+pad.mx;my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+pad.my;mx=clamp(mx,-1,1);my=clamp(my,-1,1)}
  const sp=HEROES[f.hero].spd*(f.hurtT>0?.3:1)*(f.atkT>0?.45:1);
  if(f.onBoard){const top=HEROES[f.hero].spd*1.7;f.mvx+=mx*820*dt;f.mvy+=my*520*dt;f.mvx*=Math.pow(.55,dt);f.mvy*=Math.pow(.25,dt);const v=Math.hypot(f.mvx,f.mvy);if(v>top){f.mvx*=top/v;f.mvy*=top/v}
   f.x+=(f.mvx+f.vx)*dt;f.y+=f.mvy*.62*dt;f.vx*=Math.pow(.004,dt);if(Math.abs(f.mvx)>40&&f.atkT<=0)f.face=f.mvx>0?1:-1;
   if(f.air>0){f.air-=dt;f.z=Math.sin(Math.PI*Math.max(0,f.air)/.7)*90;if(f.air<=0){f.z=0;SFX.hit();for(const b of G.F)if(b!==f&&b.state!=='ko'&&sideOf(b)!==sideOf(f)&&Math.hypot(b.x-f.x,(b.y-f.y)*1.6)<70){bail(b,'С ПРЫЖКА!');if(b.state==='ko')f.kills++}}}
   else{for(const r of rampsNow())if(f.x>r.x+r.w*.5&&f.x<r.x+r.w+10&&f.y>r.y&&f.y<r.y+r.h&&Math.abs(f.mvx)>150){f.air=.7;f.mvx*=1.15;SFX.whoosh();G.FX.push({x:f.x,y:f.y-150,t:0,life:.6,txt:'ОЛЛИ!',c:'#e8b23a'})}
    if(mode==='bike')for(const o of G.BX)if(f.x>o.x-10&&f.x<o.x+o.w+10&&f.y>o.y-8&&f.y<o.y+o.h+8){bail(f,o.k==='car'?'В МАШИНУ!':'ВРЕЗАЛСЯ!');f.x-=40}
    for(const h of holesNow())if(Math.hypot(f.x-h.x,(f.y-h.y)*2)<h.r){bail(f,mode==='bike'?'В ЯМУ!':'В ЛЮК!');if(mode!=='bike')f.x+=f.face*50}}
   if(f.x<42||f.x>W-42)f.mvx*=-.5;if(f.y<FLOOR0+52||f.y>FLOOR1-2)f.mvy*=-.5}
  else{f.x+=(mx*sp+f.vx)*dt;f.y+=my*sp*.62*dt;f.vx*=Math.pow(.004,dt)}
  if(!f.bot&&!f.onBoard&&Math.abs(mx)>.2&&f.atkT<=0)f.face=mx>0?1:-1;
  f.x=clamp(f.x,mode==='bike'?-20:40,W-40);f.y=clamp(f.y,FLOOR0+50,FLOOR1);
  for(const o of OBST){if(f.x>o.x-14&&f.x<o.x+o.w+14&&f.y>o.y-6&&f.y<o.y+o.h+6){const dl=f.x-(o.x-14),dr=o.x+o.w+14-f.x,du=f.y-(o.y-6),dd=o.y+o.h+6-f.y,m=Math.min(dl,dr,du,dd);if(m===dl)f.x=o.x-14;else if(m===dr)f.x=o.x+o.w+14;else if(m===du)f.y=o.y-6;else f.y=o.y+o.h+6}}
  if(f.state==='down'||f.state==='ko')continue;
  if(f.state!=='hurt'||f.hurtT<=0)f.state=Math.abs(mx)+Math.abs(my)>.2?'walk':'idle';
  pickupNear(f)}
 // separation
 for(let i=0;i<G.F.length;i++)for(let j=i+1;j<G.F.length;j++){const a=G.F[i],b=G.F[j];if(a.state==='ko'||b.state==='ko')continue;const dx=b.x-a.x,dy=(b.y-a.y)*2,d=Math.hypot(dx,dy);if(d<36&&d>0){const p=(36-d)/2;a.x-=dx/d*p;b.x+=dx/d*p;if(ride()&&a.onBoard&&b.onBoard&&a.air<=0&&b.air<=0&&sideOf(a)!==sideOf(b)){const rv=Math.hypot(a.mvx-b.mvx,a.mvy-b.mvy);if(rv>260){const va=Math.hypot(a.mvx,a.mvy),vb=Math.hypot(b.mvx,b.mvy);bail(va<vb?a:b,'ТАРАН!')}}}}
 // bullets
 for(let i=G.B.length-1;i>=0;i--){const b=G.B[i];b.x+=b.vx*dt;b.life-=dt;let hit=false;
  for(const f of G.F){if(f===b.o||f.state==='ko'||sideOf(f)===sideOf(b.o))continue;if(Math.abs(f.x-b.x)<22&&Math.abs(f.y-b.yy)<34){if(b.stone){damage(b.o,f,WEAPONS.stone.dmg,WEAPONS.stone.knock,Math.random()<.5);SFX.hit()}else damage(b.o,f,WEAPONS.pistol.dmg,WEAPONS.pistol.knock,true);if(BLOOD)decalBlood(f.x+Math.sign(b.vx)*50,f.y,18);hit=true;break}}
  if(hit||b.life<=0||b.x<0||b.x>W)G.B.splice(i,1)}
 // bike: scrolling street, hazards, police
 if(mode==='bike'&&!G.over){const d=SCROLL*dt;G.dist+=d;for(const L of [G.RM,G.HL,G.BX,G.P])for(let i=L.length-1;i>=0;i--){L[i].x-=d;if(L[i].x<-200)L.splice(i,1)}
  G.hzT-=dt;if(G.hzT<=0&&G.t<BIKE_T-3){G.hzT=rnd(.9,1.7);const y=rnd(FLOOR0+70,FLOOR1-30),r=Math.random();if(r<.35)G.HL.push({x:W+60,y,r:28});else if(r<.65)G.BX.push({x:W+40,y:y-14,w:44,h:28,k:'barrel'});else if(r<.75&&!G.BX.some(o=>o.k==='car'&&o.x>W-400))G.BX.push({x:W+40,y:y-20,w:150,h:46,k:'car'});else G.RM.push({x:W+40,y:y-40,w:110,h:56})}
  const near=alive().sort((a,b)=>a.x-b.x)[0];if(near)G.copY+=(near.y-G.copY)*Math.min(1,dt*2);
  for(const f of G.F)if(f.state!=='ko'&&f.x<120){f.state='ko';f.hp=0;f.onBoard=false;f.downT=0;SFX.ko();G.FX.push({x:Math.max(80,f.x),y:f.y-170,t:0,life:1.2,txt:'ПРИНЯЛИ!',c:'#4a8aff',big:1})}}
 // drops
 G.dropT-=dt;if(G.dropT<=0&&G.P.length<5){spawnDrop();G.dropT=rnd(4,7)}
 // particles
 for(let i=G.FX.length-1;i>=0;i--){const p=G.FX[i];p.t+=dt;if(p.vx!=null){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;if(p.blood&&p.y>p.gnd){if(BLOOD){dctx.fillStyle=p.c;dctx.beginPath();dctx.ellipse(p.x,p.gnd,p.s*1.4,p.s*.6,0,0,TAU);dctx.fill()}p.t=p.life}}if(p.t>=p.life)G.FX.splice(i,1)}
 if(shake>0)shake=Math.max(0,shake-dt*30);
 // round end
 if(!G.over){const sides=new Set(alive().map(sideOf));const meDead=me.state==='ko'&&mode==='ffa';
  const fin=mode==='bike'&&G.t>=BIKE_T;if(sides.size<=1||meDead||fin){G.over=1;G.overT=0;let winSide=sides.size===1?[...sides][0]:null;if(fin&&sides.size>1){const lead=alive().sort((a,b)=>b.x-a.x)[0];winSide=sideOf(lead);G.FX.push({x:lead.x,y:lead.y-180,t:0,life:2,txt:'ПЕРВЫЙ!',c:'#e8b23a',big:1})}
   G.win=winSide!=null&&winSide===sideOf(me);G.wins[G.win?'me':'them']=(G.wins[G.win?'me':'them']||0)+1;
   G.msg=G.win?'УЛИЦА ЗА ТОБОЙ':'ТЕБЯ ОТШИЛИ';G.msgT=99;SFX.bell()}}
 else{G.overT+=dt;if(G.overT>2.6)roundEnd()}}
